spring:
  ai:
    # 채팅 LLM 은 Gemini 의 OpenAI 호환 엔드포인트를 사용한다(dev 와 동일 방식).
    # 프로바이더 빈은 prod 프로파일의 OpenAiLlmProvider 이지만, base-url 을 Gemini 로 지정해 Gemini 모델을 호출한다.
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-3.1-flash-lite
          max-tokens: 1024
          temperature: 0.7

# Swagger/OpenAPI는 prod에서 노출하지 않는다 (보안). 런타임 엔드포인트를 완전히 비활성화.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  ads:
    google:
      # Android·iOS 보상형 광고 단위 ID 를 콤마로 구분해 나열한다(필수).
      rewarded-ad-unit-ids: ${APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS}
      timestamp-tolerance: ${APP_ADS_GOOGLE_TIMESTAMP_TOLERANCE:1h}
      timestamp-future-skew: ${APP_ADS_GOOGLE_TIMESTAMP_FUTURE_SKEW:5m}
  offerwall:
    tnk:
      # 미설정 시 빈 값으로 기동(부팅 실패 방지). 빈 키면 해당 플랫폼 콜백이 모두 서명 실패로 거절(fail-closed).
      android:
        app-key: ${APP_OFFERWALL_TNK_ANDROID_APP_KEY:}
      ios:
        app-key: ${APP_OFFERWALL_TNK_IOS_APP_KEY:}

# O-Auth: production client registered in Google Cloud Console
oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}
    redirect-uri: ${APPLE_REDIRECT_URI:}
  registration:
    google-app:
      provider: google
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
