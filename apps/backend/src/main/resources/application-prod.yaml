spring:
  ai:
    # 채팅 LLM 은 Gemini 의 OpenAI 호환 엔드포인트를 사용한다(dev 와 동일 방식).
    # 프로바이더 빈은 prod 프로파일의 OpenAiLlmProvider 이지만, base-url 을 Gemini 로 지정해 Gemini 모델을 호출한다.
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-3.1-flash-lite-preview
          max-tokens: 1024
          temperature: 0.7

app:
  ads:
    google:
      rewarded-ad-unit-id: ${APP_ADS_GOOGLE_REWARDED_AD_UNIT_ID}

# O-Auth: production client registered in Google Cloud Console
oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}
    redirect-uri: ${APPLE_REDIRECT_URI:}
  registration:
    google-app:
      provider: google
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
