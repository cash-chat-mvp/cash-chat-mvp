spring:

  config:
    import: optional:file:.env[.properties]

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  profiles:
    active: dev

  application.name: cash-chat-api

  h2.console.enabled: true

  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL: prod(MySQL)와 동일한 방언으로 Flyway 마이그레이션을 실행하기 위함
    # DB_CLOSE_DELAY=-1: 마지막 커넥션이 닫혀도 인메모리 DB를 JVM 종료까지 유지해 Flyway가 적용한 스키마가 보존되도록 함
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

app:
  points:
    initial-balance: ${APP_POINTS_INITIAL_BALANCE:1}
  ads:
    google:
      ssv-public-keys-uri: ${APP_ADS_GOOGLE_SSV_PUBLIC_KEYS_URI:https://www.gstatic.com/admob/reward/verifier-keys.json}
      public-key-cache-ttl: ${APP_ADS_GOOGLE_PUBLIC_KEY_CACHE_TTL:24h}
      rewarded-ad-unit-id: ${APP_ADS_GOOGLE_REWARDED_AD_UNIT_ID:}

# O-Auth (Open Authorization)
# OAuth registration is defined per profile: application-dev.yaml / application-prod.yaml
oauth:
  provider:
    google:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  apple:
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}


# JWT (JSON Web Token)
jwt:
  secret-key: ${JWT_SECRET:this-is-a-development-secret-key-at-least-32-bytes-long!!}
  # 30 (m) = 1,800 (s) = 1,800,000 (ms)
  access-token-expiry: 1800000
  # 14 (d) = 336 (h) = 20,160 (m) = 1,209,600 (s) = 1,209,600,000 (ms)
  refresh-token-expiry: 1209600000
