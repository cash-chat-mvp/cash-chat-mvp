spring:

  config:
    import: optional:file:.env[.properties]

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  profiles:
    active: dev

  application.name: cash-chat-api

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

app:
  points:
    initial-balance: ${APP_POINTS_INITIAL_BALANCE:1}
  ads:
    google:
      ssv-public-keys-uri: ${APP_ADS_GOOGLE_SSV_PUBLIC_KEYS_URI:https://www.gstatic.com/admob/reward/verifier-keys.json}
      public-key-cache-ttl: ${APP_ADS_GOOGLE_PUBLIC_KEY_CACHE_TTL:24h}
      rewarded-ad-unit-id: ${APP_ADS_GOOGLE_REWARDED_AD_UNIT_ID:}
  energy:
    max-energy: 50
    signup-bonus: 50
    post-evolution-ratio: 0.5
  evolution:
    rules:
      - from-level: 1
        attempt-cost: 500
        success-rate: 0.7
      - from-level: 2
        attempt-cost: 1200
        success-rate: 0.5
      - from-level: 3
        attempt-cost: 3000
        success-rate: 0.25
      - from-level: 4
        attempt-cost: 8000
        success-rate: 0.1
  ledger:
    risk-rate: 0.15
    service-rate: 0.1
    min-profit-rate: 0.2
    min-profit-floor: 2
    rewards:
      - source: AD
        cashable-pt: 4
        energy: 3
  quality:
    pool-safety-floor-centi-pt: 500000
    premium-daily-cap-per-user: 50

# OAuth registration is defined per profile: application-dev.yaml / application-prod.yaml
oauth:
  provider:
    google:
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  apple:
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}

jwt:
  secret-key: ${JWT_SECRET:this-is-a-development-secret-key-at-least-32-bytes-long!!}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000
