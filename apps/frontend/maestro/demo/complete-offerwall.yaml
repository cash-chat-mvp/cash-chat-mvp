# 데모(사람이 보기용) — complete-offerwall happy.
# 실행: maestro test maestro/demo/complete-offerwall.yaml
appId: com.nomadclub.cashchat
---
- launchApp:
    clearState: true
    arguments:
      scenario: "happy"
- runFlow:
    when:
      visible: "Don't Show Again"
    commands:
      - tapOn: "Don't Show Again"
- runFlow: _pause.yaml
- tapOn: "리워드"
- runFlow: _pause.yaml
- scrollUntilVisible:
    element: "TNK 오퍼월"
    direction: DOWN
- takeScreenshot: ow-1-card
- tapOn: "TNK 오퍼월"
- runFlow: _pause.yaml
- scrollUntilVisible:
    element: "🪙 1500"
    direction: UP
- takeScreenshot: ow-2-balance
