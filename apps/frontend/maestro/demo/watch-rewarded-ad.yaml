# 데모(사람이 보기용) — watch-rewarded-ad happy.
# 실행: maestro test maestro/demo/watch-rewarded-ad.yaml
appId: com.nomadclub.cashchat
---
- launchApp:
    clearState: true
    arguments:
      scenario: "happy"
- runFlow:
    when:
      visible: "Don't Show Again"
    commands:
      - tapOn: "Don't Show Again"
- runFlow: _pause.yaml
- tapOn: "리워드"
- runFlow: _pause.yaml
- takeScreenshot: ad-1-rewards
- tapOn: "▶  광고 보기"
- assertVisible: "에너지를 충전했어요!"
- runFlow: _pause.yaml
- takeScreenshot: ad-2-rewarded
