name: Code Review Helper Comment Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to comment on
        required: true
        default: '109'
      body:
        description: Comment body
        required: true
        default: '@coderabbitai rate limit'

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create code-review-helper token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.CODE_REVIEW_HELPER_APP_ID }}
          private-key: ${{ secrets.CODE_REVIEW_HELPER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Post comment as code-review-helper
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ inputs.body }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: process.env.COMMENT_BODY,
            });

            console.log(`Posted comment on PR #${process.env.PR_NUMBER} as code-review-helper.`);
