name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/backend/**"
      - "infra/deploy/backend/**"
      - ".github/workflows/backend-cicd.yml"
  push:
    branches:
      - dev
    paths:
      - "apps/backend/**"
      - "infra/deploy/backend/**"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

  cd:
    name: Backend CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare backend image name
        id: backend-image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/cash-chat-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.backend-image.outputs.name }}:${{ github.sha }}
            ${{ steps.backend-image.outputs.name }}:latest

      - name: Create deploy env file
        shell: bash
        env:
          BACKEND_SPRING_PROFILES_ACTIVE: ${{ secrets.BACKEND_SPRING_PROFILES_ACTIVE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_DEVELOPMENT_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}
          APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS: ${{ secrets.APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS }}
          APP_OFFERWALL_TNK_ANDROID_APP_KEY: ${{ secrets.APP_OFFERWALL_TNK_ANDROID_APP_KEY }}
          APP_OFFERWALL_TNK_IOS_APP_KEY: ${{ secrets.APP_OFFERWALL_TNK_IOS_APP_KEY }}
          APP_OFFERWALL_TNK_POINT_TO_COIN_RATIO: ${{ secrets.APP_OFFERWALL_TNK_POINT_TO_COIN_RATIO }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${{ secrets.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}
        run: |
          SPRING_PROFILE="${BACKEND_SPRING_PROFILES_ACTIVE}"
          if [ -z "${SPRING_PROFILE}" ]; then
            SPRING_PROFILE="prod"
          fi

          if [ "${SPRING_PROFILE}" = "prod" ]; then
            missing_vars=()
            if [ -z "${SPRING_DATASOURCE_URL}" ]; then missing_vars+=("SPRING_DATASOURCE_URL"); fi
            if [ -z "${SPRING_DATASOURCE_USERNAME}" ]; then missing_vars+=("SPRING_DATASOURCE_USERNAME"); fi
            if [ -z "${SPRING_DATASOURCE_PASSWORD}" ]; then missing_vars+=("SPRING_DATASOURCE_PASSWORD"); fi
            if [ -z "${GEMINI_API_KEY}" ]; then missing_vars+=("GEMINI_API_KEY"); fi
            if [ -z "${GOOGLE_CLIENT_ID}" ]; then missing_vars+=("GOOGLE_CLIENT_ID"); fi
            if [ -z "${GOOGLE_CLIENT_SECRET}" ]; then missing_vars+=("GOOGLE_CLIENT_SECRET"); fi
            if [ -z "${GOOGLE_REDIRECT_URI}" ]; then missing_vars+=("GOOGLE_REDIRECT_URI"); fi
            if [ -z "${APPLE_CLIENT_ID}" ]; then missing_vars+=("APPLE_CLIENT_ID"); fi
            if [ -z "${APPLE_TEAM_ID}" ]; then missing_vars+=("APPLE_TEAM_ID"); fi
            if [ -z "${APPLE_KEY_ID}" ]; then missing_vars+=("APPLE_KEY_ID"); fi
            if [ -z "${APPLE_PRIVATE_KEY}" ]; then missing_vars+=("APPLE_PRIVATE_KEY"); fi
            # APPLE_REDIRECT_URI is optional for the native iOS Sign in with Apple flow.
            if [ -z "${APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS}" ]; then missing_vars+=("APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS"); fi

            if [ "${#missing_vars[@]}" -gt 0 ]; then
              echo "Missing required prod secrets: ${missing_vars[*]}" >&2
              exit 1
            fi

            # 선택 시크릿: 미설정이어도 배포는 진행하되, TNK 오퍼월이 조용히 비활성화되지 않도록 경고로 가시성 확보.
            # TNK 는 Android/iOS 앱을 별도 등록하므로 앱키도 플랫폼별로 확인한다.
            if [ -z "${APP_OFFERWALL_TNK_ANDROID_APP_KEY}" ]; then
              echo "::warning::APP_OFFERWALL_TNK_ANDROID_APP_KEY is not set — Android TNK offerwall callbacks will be rejected (fail-closed) until configured."
            fi
            if [ -z "${APP_OFFERWALL_TNK_IOS_APP_KEY}" ]; then
              echo "::warning::APP_OFFERWALL_TNK_IOS_APP_KEY is not set — iOS TNK offerwall callbacks will be rejected (fail-closed) until configured."
            fi
          fi

          DATASOURCE_DRIVER="${SPRING_DATASOURCE_DRIVER_CLASS_NAME}"
          if [ -z "${DATASOURCE_DRIVER}" ]; then
            DATASOURCE_DRIVER="com.mysql.cj.jdbc.Driver"
          fi

          write_env() {
            local key="$1"
            local value="$2"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "${key} must not contain newlines" >&2
              exit 1
            fi
            if [[ "${value}" == *"'"* ]]; then
              echo "${key} must not contain single quotes" >&2
              exit 1
            fi
            printf "%s='%s'\n" "${key}" "${value}"
          }

          {
            write_env "BACKEND_IMAGE" "${{ steps.backend-image.outputs.name }}:latest"
            write_env "SPRING_PROFILES_ACTIVE" "${SPRING_PROFILE}"
            write_env "SPRING_DATASOURCE_URL" "${SPRING_DATASOURCE_URL}"
            write_env "SPRING_DATASOURCE_USERNAME" "${SPRING_DATASOURCE_USERNAME}"
            write_env "SPRING_DATASOURCE_PASSWORD" "${SPRING_DATASOURCE_PASSWORD}"
            write_env "SPRING_DATASOURCE_DRIVER_CLASS_NAME" "${DATASOURCE_DRIVER}"
            write_env "GEMINI_API_KEY" "${GEMINI_API_KEY}"
            write_env "GOOGLE_CLIENT_ID" "${GOOGLE_CLIENT_ID}"
            write_env "GOOGLE_CLIENT_SECRET" "${GOOGLE_CLIENT_SECRET}"
            write_env "GOOGLE_REDIRECT_URI" "${GOOGLE_REDIRECT_URI}"
            write_env "APPLE_CLIENT_ID" "${APPLE_CLIENT_ID}"
            write_env "APPLE_TEAM_ID" "${APPLE_TEAM_ID}"
            write_env "APPLE_KEY_ID" "${APPLE_KEY_ID}"
            write_env "APPLE_PRIVATE_KEY" "${APPLE_PRIVATE_KEY}"
            write_env "APPLE_REDIRECT_URI" "${APPLE_REDIRECT_URI}"
            write_env "APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS" "${APP_ADS_GOOGLE_REWARDED_AD_UNIT_IDS}"
            write_env "APP_OFFERWALL_TNK_ANDROID_APP_KEY" "${APP_OFFERWALL_TNK_ANDROID_APP_KEY}"
            write_env "APP_OFFERWALL_TNK_IOS_APP_KEY" "${APP_OFFERWALL_TNK_IOS_APP_KEY}"
            write_env "APP_OFFERWALL_TNK_POINT_TO_COIN_RATIO" "${APP_OFFERWALL_TNK_POINT_TO_COIN_RATIO}"
          } > infra/deploy/backend/.deploy.env

      - name: Upload compose files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/deploy/backend/docker-compose.yml,infra/deploy/backend/.deploy.env"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 3

      - name: Deploy backend via Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ -n "${GHCR_TOKEN}" ] && [ -n "${GHCR_USERNAME}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            docker compose --env-file .deploy.env -f docker-compose.yml pull
            docker compose --env-file .deploy.env -f docker-compose.yml up -d --remove-orphans
            docker compose --env-file .deploy.env -f docker-compose.yml ps

      - name: 백엔드 배포 성공 Discord 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ${{ steps.backend-image.outputs.name }}:latest
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ℹ️ DEPLOY_BOT_DISCORD 없음 — 알림 건너뜀"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --arg image "$IMAGE_TAG" \
            '{embeds: [{
              color: 5763719,
              title: "✅ 백엔드 배포 완료",
              description: "**백엔드 이미지 푸시와 Docker Compose 배포가 완료되었습니다**",
              fields: [
                {name: "브랜치", value: ("`" + $branch + "`"), inline: true},
                {name: "배포자", value: ("`" + $actor + "`"), inline: true},
                {name: "커밋", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "이미지", value: ("`" + $image + "`"), inline: false},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "Actions 로그", value: ("[Actions 로그 바로가기](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat • 백엔드 배포"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord 알림 전송 실패"

      - name: 백엔드 배포 실패 Discord 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ℹ️ DEPLOY_BOT_DISCORD 없음 — 알림 건너뜀"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨 백엔드 배포 실패",
              description: "**백엔드 이미지 빌드, 푸시 또는 서버 배포에 실패했습니다**",
              fields: [
                {name: "브랜치", value: ("`" + $branch + "`"), inline: true},
                {name: "실행자", value: ("`" + $actor + "`"), inline: true},
                {name: "커밋", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "Actions 로그", value: ("[Actions 로그 바로가기](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat • 백엔드 배포"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord 알림 전송 실패"
