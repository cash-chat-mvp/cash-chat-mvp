name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/backend/**"
      - "infra/deploy/backend/**"
      - ".github/workflows/backend-cicd.yml"
  push:
    branches:
      - dev
    paths:
      - "apps/backend/**"
      - "infra/deploy/backend/**"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

  cd:
    name: Backend CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cash-chat-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cash-chat-backend:latest

      - name: Create deploy env file
        shell: bash
        env:
          BACKEND_SPRING_PROFILES_ACTIVE: ${{ secrets.BACKEND_SPRING_PROFILES_ACTIVE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          SPRING_PROFILE="${BACKEND_SPRING_PROFILES_ACTIVE}"
          if [ -z "${SPRING_PROFILE}" ]; then
            SPRING_PROFILE="prod"
          fi

          if [ "${SPRING_PROFILE}" = "prod" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY must be set when SPRING_PROFILES_ACTIVE=prod" >&2
            exit 1
          fi

          {
            echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/cash-chat-backend:latest"
            echo "SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
          } > infra/deploy/backend/.deploy.env

      - name: Upload compose files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/deploy/backend/docker-compose.yml,infra/deploy/backend/.deploy.env"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 3

      - name: Deploy backend via Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ -n "${GHCR_TOKEN}" ] && [ -n "${GHCR_USERNAME}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            docker compose --env-file .deploy.env -f docker-compose.yml pull
            docker compose --env-file .deploy.env -f docker-compose.yml up -d --remove-orphans
            docker compose --env-file .deploy.env -f docker-compose.yml ps

      - name: Discord backend deploy success notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/cash-chat-backend:${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is missing - skip notification"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --arg image "$IMAGE_TAG" \
            '{embeds: [{
              color: 5763719,
              title: "Backend deployment complete",
              description: "**Backend image push and Docker Compose deployment completed**",
              fields: [
                {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                {name: "Deployer", value: ("`" + $actor + "`"), inline: true},
                {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "Image", value: ("`" + $image + "`"), inline: false},
                {name: "Commit message", value: ("`" + $msg + "`"), inline: false},
                {name: "Actions log", value: ("[Open run](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat - Backend Deploy"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notification failed"

      - name: Discord backend deploy failure notification
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is missing - skip notification"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            '{embeds: [{
              color: 15548997,
              title: "Backend deployment failed",
              description: "**Backend image build, push, or server deployment failed**",
              fields: [
                {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                {name: "Actor", value: ("`" + $actor + "`"), inline: true},
                {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "Commit message", value: ("`" + $msg + "`"), inline: false},
                {name: "Actions log", value: ("[Open run](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat - Backend Deploy"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notification failed"
