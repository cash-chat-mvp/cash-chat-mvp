name: CodeRabbit Review Queue

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: coderabbit-review-queue
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request CodeRabbit review for oldest queued PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = '검토대기';
            const query = [
              `repo:${context.repo.owner}/${context.repo.repo}`,
              'is:pr',
              'is:open',
              `label:"${label}"`,
            ].join(' ');

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: query,
              sort: 'created',
              order: 'asc',
              per_page: 1,
            });

            if (data.items.length === 0) {
              console.log(`No open PRs with "${label}" label.`);
              return;
            }

            const pr = data.items[0];
            const pullNumber = pr.number;
            const reviewCommand = '@coderabbitai full review';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });

            const alreadyRequested = comments.some((comment) =>
              comment.user?.type === 'Bot' && comment.body?.trim() === reviewCommand
            );
            const reviewStatus = alreadyRequested ? 'kept existing request for' : 'requested';

            if (alreadyRequested) {
              console.log(`CodeRabbit full review was already requested for PR #${pullNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: reviewCommand,
              });
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                name: label,
              });
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }

              console.log(`"${label}" label was already absent from PR #${pullNumber}.`);
            }

            console.log(
              `CodeRabbit full review ${reviewStatus} PR #${pullNumber} and ensured "${label}" label is removed.`
            );
