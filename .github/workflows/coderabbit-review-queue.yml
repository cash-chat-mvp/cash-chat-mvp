name: CodeRabbit Review Queue

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: coderabbit-review-queue
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request CodeRabbit review for oldest queued PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = '검토대기';
            const query = [
              `repo:${context.repo.owner}/${context.repo.repo}`,
              'is:pr',
              'is:open',
              `label:"${label}"`,
            ].join(' ');

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: query,
              sort: 'created',
              order: 'asc',
              per_page: 1,
            });

            if (data.items.length === 0) {
              console.log(`No open PRs with "${label}" label.`);
              return;
            }

            const pr = data.items[0];
            const pullNumber = pr.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              body: '@coderabbitai full review',
            });

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              name: label,
            });

            console.log(
              `Requested CodeRabbit full review for PR #${pullNumber} and removed "${label}" label.`
            );
