name: FE Release — Android & iOS Distribute

on:
  push:
    branches:
      - 'release-fe'

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: 버전 태그 채번 (Android/iOS 공통 — 한 번만 실행)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  version:
    if: github.repository == 'cash-chat-mvp/cash-chat-mvp'
    runs-on: ubuntu-latest
    outputs:
      name:       ${{ steps.ver.outputs.name }}
      name_short: ${{ steps.ver.outputs.name_short }}
      code: ${{ steps.ver.outputs.code }}
      tag:  ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-bump version tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Set version outputs
        id: ver
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          # Strip pre-release suffix (e.g. "0.1.0-release-fe.0" → "0.1.0")
          VERSION_SHORT=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$VERSION_SHORT" | cut -d. -f1)
          MINOR=$(echo "$VERSION_SHORT" | cut -d. -f2)
          PATCH=$(echo "$VERSION_SHORT" | cut -d. -f3)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VERSION"                         >> $GITHUB_OUTPUT
          echo "name_short=$VERSION_SHORT"             >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE"                    >> $GITHUB_OUTPUT
          echo "tag=${{ steps.bump.outputs.new_tag }}" >> $GITHUB_OUTPUT
          echo "✅ versionName=$VERSION (short=$VERSION_SHORT) / versionCode=$VERSION_CODE"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Android — Firebase App Distribution
# ─────────────────────────────────────────────────────────────────────────────
  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/frontend

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cashchat-release.keystore

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write local.properties
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}"                                     >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"                 >> local.properties
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}"                             >> local.properties
          echo "ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}"       >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}" >> local.properties
          echo "ADMOB_NATIVE_AD_UNIT_ID=${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}"       >> local.properties
          echo "ADMOB_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}"   >> local.properties
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"                                 >> local.properties

      - name: Write Firebase Service Account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SA" > service-account.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Fastlane distribute
        env:
          KEYSTORE_PATH:            ${{ github.workspace }}/apps/frontend/cashchat-release.keystore
          KEYSTORE_STORE_PASSWORD:  ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS:       ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD:    ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          FIREBASE_APP_ID:          ${{ secrets.FIREBASE_APP_ID }}
          VERSION_NAME:             ${{ needs.version.outputs.name }}
          VERSION_CODE:             ${{ needs.version.outputs.code }}
          RELEASE_NOTES: |
            ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.code }})
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
        run: bundle exec fastlane android distribute

      - name: Find APK path
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK를 찾지 못했습니다"
            exit 1
          fi
          echo "path=$APK"          >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/frontend/${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Discord 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          TIMESTAMP:       ${{ github.event.head_commit.timestamp }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          VERSION_NAME:    ${{ needs.version.outputs.name }}
          VERSION_CODE:    ${{ needs.version.outputs.code }}
          VERSION_TAG:     ${{ needs.version.outputs.tag }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "ℹ️ DISCORD_WEBHOOK 없음 — 건너뜀" && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg ts "$TIMESTAMP" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            --arg version "v${VERSION_NAME} (build ${VERSION_CODE})" \
            '{embeds: [{
              color: 5763719,
              title: "✅  Android 배포 완료",
              description: "**Firebase App Distribution 배포 성공**",
              fields: [
                {name: "버전",    value: ("`" + $version + "`"), inline: true},
                {name: "배포자",  value: ("`" + $actor + "`"),   inline: true},
                {name: "커밋",    value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"},
              timestamp: $ts
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Discord 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨  Android 빌드/배포 실패",
              fields: [
                {name: "브랜치",  value: ("`" + $branch + "`"), inline: true},
                {name: "실패자",  value: ("`" + $actor + "`"),  inline: true},
                {name: "커밋",    value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "로그 확인",  value: ("[Actions 로그](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: iOS — TestFlight
# ─────────────────────────────────────────────────────────────────────────────
  ios:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # KMM 빌드 페이즈(embedAndSignAppleFrameworkForXcode)가 JAVA_HOME을 필요로 함
      - name: Set JAVA_HOME for KMM
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/frontend

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/frontend/CashChatIOS/CashChatIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Create Secrets.swift
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          API_SERVER_BASE_URL:  ${{ secrets.API_SERVER_BASE_URL }}
        run: |
          cat > CashChatIOS/CashChatIOS/Secrets.swift << 'SWIFT_EOF'
          // Auto-generated — do not commit
          enum Secrets {
              static let googleIOSClientId = "IOS_GOOGLE_CLIENT_ID_PLACEHOLDER"
              static let googleWebClientId = "GOOGLE_CLIENT_ID_PLACEHOLDER"
              static let apiBaseUrl        = "API_SERVER_BASE_URL_PLACEHOLDER"
          }
          SWIFT_EOF
          sed -i '' \
            -e "s|IOS_GOOGLE_CLIENT_ID_PLACEHOLDER|${IOS_GOOGLE_CLIENT_ID}|g" \
            -e "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${GOOGLE_CLIENT_ID}|g" \
            -e "s|API_SERVER_BASE_URL_PLACEHOLDER|${API_SERVER_BASE_URL}|g" \
            CashChatIOS/CashChatIOS/Secrets.swift

      - name: Create local.xcconfig
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
        run: |
          REVERSED=$(echo "$IOS_GOOGLE_CLIENT_ID" | awk -F'.' '{for(i=NF;i>=1;i--) printf "%s%s",$i,(i==1?"\n":".")}')
          cat > CashChatIOS/local.xcconfig << EOF
          GOOGLE_IOS_CLIENT_ID = ${IOS_GOOGLE_CLIENT_ID}
          GOOGLE_REVERSED_CLIENT_ID = ${REVERSED}
          EOF

      # ── 코드 서명 설정 ──────────────────────────────────────────────────────
      - name: Set up keychain & import certificate
        env:
          CERTIFICATE_P12_BASE64:  ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Verify bundle ID
        env:
          EXPECTED_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          ACTUAL=$(grep -A1 'PRODUCT_BUNDLE_IDENTIFIER' \
            CashChatIOS/CashChatIOS.xcodeproj/project.pbxproj \
            | grep -o 'com\.nomadlab\.[^;]*' | head -1)
          if [ "$ACTUAL" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle ID 불일치 — expected=$EXPECTED_BUNDLE_ID actual=$ACTUAL"
            exit 1
          fi
          echo "✅ Bundle ID 일치: $ACTUAL"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/cashchat.mobileprovision"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" \
            /dev/stdin <<< "$(security cms -D -i "$PROFILES_DIR/cashchat.mobileprovision")")
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "✅ Provisioning Profile: $PROFILE_NAME"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Fastlane iOS distribute
        env:
          ASC_API_KEY_ID:             ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID:          ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_CONTENT:        ${{ secrets.ASC_API_KEY_CONTENT }}
          IOS_BUNDLE_ID:              ${{ secrets.IOS_BUNDLE_ID }}
          IOS_DEVELOPMENT_TEAM_ID:    ${{ secrets.IOS_DEVELOPMENT_TEAM_ID }}
          VERSION_NAME:               ${{ needs.version.outputs.name }}
          VERSION_CODE:               ${{ needs.version.outputs.code }}
          RELEASE_NOTES: |
            ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.code }})
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
        run: bundle exec fastlane ios distribute

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/frontend/build/CashChatIOS.ipa
          retention-days: 7

      - name: Discord 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          TIMESTAMP:       ${{ github.event.head_commit.timestamp }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          VERSION_NAME:    ${{ needs.version.outputs.name }}
          VERSION_CODE:    ${{ needs.version.outputs.code }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "ℹ️ DISCORD_WEBHOOK 없음 — 건너뜀" && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg ts "$TIMESTAMP" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            --arg version "v${VERSION_NAME} (build ${VERSION_CODE})" \
            '{embeds: [{
              color: 5763719,
              title: "✅  iOS 배포 완료",
              description: "**TestFlight 업로드 성공**",
              fields: [
                {name: "버전",    value: ("`" + $version + "`"), inline: true},
                {name: "배포자",  value: ("`" + $actor + "`"),   inline: true},
                {name: "커밋",    value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false}
              ],
              footer: {text: "Cash Chat · iOS Build"},
              timestamp: $ts
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Discord 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨  iOS 빌드/배포 실패",
              fields: [
                {name: "브랜치",  value: ("`" + $branch + "`"), inline: true},
                {name: "실패자",  value: ("`" + $actor + "`"),  inline: true},
                {name: "커밋",    value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "로그 확인",  value: ("[Actions 로그](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · iOS Build"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: GitHub Release 생성 (Android APK + 릴리즈 노트)
# ─────────────────────────────────────────────────────────────────────────────
  github-release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: GitHub Release 생성 및 APK 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name:     ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
