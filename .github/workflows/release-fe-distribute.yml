name: FE Release — Build & Distribute

on:
  push:
    branches:
      - 'release-fe'

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: 버전 채번(Semantic) + AI 릴리즈 노트 생성
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  version:
    if: github.repository == 'cash-chat-mvp/cash-chat-mvp'
    runs-on: ubuntu-latest
    outputs:
      name:          ${{ steps.ver.outputs.name }}
      code:          ${{ steps.ver.outputs.code }}
      tag:           ${{ steps.ver.outputs.tag }}
      release_notes: ${{ steps.ai_notes.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute semantic version & push tag
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── 현재 버전: GitHub Releases API (실제 마지막 배포 버전 기준) ──────
          LAST_RELEASE=$(curl -sf \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            2>/dev/null || echo "{}")
          LAST_TAG=$(echo "$LAST_RELEASE" | jq -r '.tag_name // ""')
          # 릴리즈가 없으면 Apple 기준 최소 버전(1.0.0)으로 시작
          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" = "null" ]; then
            LAST_TAG="v1.0.0"
            echo "ℹ️ GitHub Release 없음 — 기준 버전 v1.0.0 사용"
          fi
          LAST_VER="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VER"
          echo "ℹ️ 기준 버전: ${LAST_TAG}"

          # ── 머지된 PR 정보 조회 (버전 동기화 + major 라벨 확인) ───────────
          MERGE_MSG=$(git log -1 --pretty=format:"%s")
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' 2>/dev/null || echo "")
          VERSION_FROM_PR=""
          HAS_MAJOR_LABEL="false"

          if [ -n "$PR_NUMBER" ]; then
            PR_DATA=$(curl -sf \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              2>/dev/null || echo "{}")
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
            VERSION_FROM_PR=$(echo "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | tr -d 'v' || echo "")
            PR_LABELS=$(echo "$PR_DATA" | jq -r '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            if echo "$PR_LABELS" | grep -qiE 'version\.major'; then
              HAS_MAJOR_LABEL="true"
            fi
          fi

          if [ -n "$VERSION_FROM_PR" ]; then
            # PR 제목에 버전이 있으면 그대로 사용 → MR↔배포 버전 동기화
            NEW_VERSION="$VERSION_FROM_PR"
            echo "ℹ️ PR 제목에서 버전 추출: v${NEW_VERSION}"
          else
            # 커밋 수 기반 버전 계산 (마지막 릴리즈 이후 커밋만)
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")

            FEAT_COUNT=$(echo "$COMMITS" | grep -cE '^\[.*?\]\s+feat\s*[:：]|^feat\s*[:：]' 2>/dev/null) || FEAT_COUNT=0
            FIX_COUNT=$(echo "$COMMITS"  | grep -cE '^\[.*?\]\s+fix\s*[:：]|^fix\s*[:：]'   2>/dev/null) || FIX_COUNT=0
            BREAKING=$(echo "$COMMITS"   | grep -cE 'BREAKING[[:space:]]CHANGE'              2>/dev/null) || BREAKING=0

            if [ "$BREAKING" -gt 0 ] || [ "$HAS_MAJOR_LABEL" = "true" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$FEAT_COUNT" -gt 0 ]; then
              # feat N개 → MINOR+N, fix M개 → PATCH=M (MINOR 증가 시 PATCH 리셋)
              NEW_VERSION="${MAJOR}.$((MINOR + FEAT_COUNT)).${FIX_COUNT}"
            elif [ "$FIX_COUNT" -gt 0 ]; then
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + FIX_COUNT))"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          # versionCode: MAJOR*10000 + MINOR*100 + PATCH
          IFS='.' read -r NM NMI NP <<< "$NEW_VERSION"
          VERSION_CODE=$(( NM * 10000 + NMI * 100 + NP ))

          if [ "$VERSION_CODE" -eq 0 ]; then
            echo "::error::VERSION_CODE 계산 실패 — NEW_VERSION=${NEW_VERSION}"
            exit 1
          fi

          # 태그 생성 및 푸시
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null; then
            echo "ℹ️ 로컬 태그 v${NEW_VERSION} 이미 존재"
          else
            git tag -a "v${NEW_VERSION}" -m "chore: release v${NEW_VERSION}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEW_VERSION}" >/dev/null; then
            echo "ℹ️ 원격 태그 v${NEW_VERSION} 이미 존재 — 푸시 스킵"
          else
            git push origin "v${NEW_VERSION}"
          fi

          echo "name=${NEW_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}"    >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "✅ ${LAST_TAG} → v${NEW_VERSION} (versionCode=${VERSION_CODE})"

      - name: Generate AI Release Notes
        id: ai_notes
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
            || git rev-list --max-parents=0 HEAD)
          ALL_COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null | head -50 || echo "")

          if [ -z "${GOOGLE_GEMINI_API_KEY:-}" ] || [ -z "$ALL_COMMITS" ]; then
            {
              echo 'notes<<__NOTES_EOF__'
              echo "v${{ steps.ver.outputs.name }} 새 빌드가 배포되었습니다."
              echo '__NOTES_EOF__'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 커밋을 유형별로 분류해서 AI에게 전달
          FEAT_COMMITS=$(echo "$ALL_COMMITS" | grep -E '^\[.*?\]\s+feat\s*[:：]|^feat\s*[:：]' | sed 's/^/  - /' || echo "  없음")
          FIX_COMMITS=$(echo "$ALL_COMMITS"  | grep -E '^\[.*?\]\s+fix\s*[:：]|^fix\s*[:：]'   | sed 's/^/  - /' || echo "  없음")
          OTHER_COMMITS=$(echo "$ALL_COMMITS" | grep -vE '^\[.*?\]\s+(feat|fix)\s*[:：]|^(feat|fix)\s*[:：]' | sed 's/^/  - /' || echo "  없음")

          PROMPT=$(cat <<PROMPT_EOF
Cash Chat 앱 v${{ steps.ver.outputs.name }} 한국어 릴리즈 노트를 작성해주세요.

[새 기능 커밋]
${FEAT_COMMITS}

[버그 수정 커밋]
${FIX_COMMITS}

[기타 변경 커밋]
${OTHER_COMMITS}

작성 규칙:
- 사용자 관점에서 실제 체감 변화 중심으로 설명
- 이모지로 시작하는 불릿 포인트 3~5줄
- 함수명·파일명 등 기술 내부 상세 제외
- 전체 200자 이내로 간결하게
- 변경사항 없는 섹션은 릴리즈 노트에서 생략
PROMPT_EOF
          )

          RESPONSE=$(curl -sf \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GOOGLE_GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            --data "$(jq -n --arg p "$PROMPT" '{
              contents: [{"parts": [{"text": $p}]}]
            }')" \
            || echo '{"candidates":[{"content":{"parts":[{"text":"새로운 빌드가 배포되었습니다."}]}}]}')

          NOTES=$(echo "$RESPONSE" \
            | jq -r '.candidates[0].content.parts[0].text // "새로운 빌드가 배포되었습니다."')

          {
            echo 'notes<<__NOTES_EOF__'
            echo "$NOTES"
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Android — Firebase App Distribution
# ─────────────────────────────────────────────────────────────────────────────
  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/frontend

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cashchat-release.keystore

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write local.properties
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}"                                                     >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"                                 >> local.properties
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}"                                             >> local.properties
          echo "ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}"                       >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}"           >> local.properties
          echo "ADMOB_NATIVE_AD_UNIT_ID=${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}"                       >> local.properties
          echo "ADMOB_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}"                   >> local.properties
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"                                                 >> local.properties

      - name: Write Firebase Service Account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SA" > service-account.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Fastlane distribute (Android)
        env:
          KEYSTORE_PATH:           ${{ github.workspace }}/apps/frontend/cashchat-release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS:      ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD:   ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          FIREBASE_APP_ID:         ${{ secrets.FIREBASE_APP_ID }}
          VERSION_NAME:            ${{ needs.version.outputs.name }}
          VERSION_CODE:            ${{ needs.version.outputs.code }}
          RELEASE_NOTES:           ${{ needs.version.outputs.release_notes }}
        run: bundle exec fastlane android distribute

      - name: Find APK path
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK를 찾지 못했습니다"
            exit 1
          fi
          echo "path=$APK"               >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/frontend/${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Discord 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          TIMESTAMP:       ${{ github.event.head_commit.timestamp }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          VERSION_NAME:    ${{ needs.version.outputs.name }}
          VERSION_CODE:    ${{ needs.version.outputs.code }}
          RELEASE_NOTES:   ${{ needs.version.outputs.release_notes }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "ℹ️ DISCORD_WEBHOOK 없음 — 건너뜀" && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/v${VERSION_NAME}"
          # Discord embed 길이 제한 대응 (4096자) — 릴리즈 노트 800자 초과 시 truncate
          NOTES_DISPLAY="${RELEASE_NOTES}"
          if [ ${#RELEASE_NOTES} -gt 800 ]; then
            NOTES_DISPLAY="${RELEASE_NOTES:0:800}...\n\n👉 [전체 릴리즈 노트](${RELEASE_URL})"
          fi
          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg ts "$TIMESTAMP" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            --arg version "v${VERSION_NAME} (build ${VERSION_CODE})" \
            --arg notes "$NOTES_DISPLAY" \
            --arg release_url "$RELEASE_URL" \
            '{embeds: [{
              color: 5763719,
              title: "✅  Android 배포 완료",
              description: ("**Firebase App Distribution 배포 성공**\n\n" + $notes),
              fields: [
                {name: "버전",         value: ("`" + $version + "`"), inline: true},
                {name: "배포자",       value: ("`" + $actor + "`"),   inline: true},
                {name: "커밋",         value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "GitHub Release", value: ("[릴리즈 페이지](" + $release_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"},
              timestamp: $ts
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Discord 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨  Android 빌드/배포 실패",
              fields: [
                {name: "브랜치",      value: ("`" + $branch + "`"), inline: true},
                {name: "실패자",      value: ("`" + $actor + "`"),  inline: true},
                {name: "커밋",        value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "로그 확인",   value: ("[Actions 로그](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: iOS — TestFlight
# macos-26 runner 사용 → Xcode 26 포함 → iOS 26 SDK 지원
# (Apple: 2026년부터 iOS 26 SDK 이상으로 빌드된 앱만 업로드 가능)
# ─────────────────────────────────────────────────────────────────────────────
  ios:
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # KMM 빌드 페이즈(embedAndSignAppleFrameworkForXcode)가 JAVA_HOME을 필요로 함
      - name: Set JAVA_HOME for KMM
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/frontend

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/frontend/CashChatIOS/CashChatIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Create Secrets.swift
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          API_SERVER_BASE_URL:  ${{ secrets.API_SERVER_BASE_URL }}
        run: |
          cat > CashChatIOS/CashChatIOS/Secrets.swift << 'SWIFT_EOF'
          // Auto-generated — do not commit
          enum Secrets {
              static let googleIOSClientId = "IOS_GOOGLE_CLIENT_ID_PLACEHOLDER"
              static let googleWebClientId = "GOOGLE_CLIENT_ID_PLACEHOLDER"
              static let apiBaseUrl        = "API_SERVER_BASE_URL_PLACEHOLDER"
          }
          SWIFT_EOF
          sed -i '' \
            -e "s|IOS_GOOGLE_CLIENT_ID_PLACEHOLDER|${IOS_GOOGLE_CLIENT_ID}|g" \
            -e "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${GOOGLE_CLIENT_ID}|g" \
            -e "s|API_SERVER_BASE_URL_PLACEHOLDER|${API_SERVER_BASE_URL}|g" \
            CashChatIOS/CashChatIOS/Secrets.swift

      - name: Create local.xcconfig
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
        run: |
          REVERSED=$(echo "$IOS_GOOGLE_CLIENT_ID" | awk -F'.' '{for(i=NF;i>=1;i--) printf "%s%s",$i,(i==1?"\n":".")}')
          cat > CashChatIOS/local.xcconfig << EOF
          GOOGLE_IOS_CLIENT_ID = ${IOS_GOOGLE_CLIENT_ID}
          GOOGLE_REVERSED_CLIENT_ID = ${REVERSED}
          EOF

      # ── 코드 서명 설정 ──────────────────────────────────────────────────────
      - name: Set up keychain & import certificate
        env:
          CERTIFICATE_P12_BASE64:   ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Verify bundle ID
        env:
          EXPECTED_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          ACTUAL=$(grep -A1 'PRODUCT_BUNDLE_IDENTIFIER' \
            CashChatIOS/CashChatIOS.xcodeproj/project.pbxproj \
            | grep -o 'com\.nomadlab\.[^;]*' | head -1)
          if [ "$ACTUAL" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle ID 불일치 — expected=$EXPECTED_BUNDLE_ID actual=$ACTUAL"
            exit 1
          fi
          echo "✅ Bundle ID 일치: $ACTUAL"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/cashchat.mobileprovision"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" \
            /dev/stdin <<< "$(security cms -D -i "$PROFILES_DIR/cashchat.mobileprovision")")
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "✅ Provisioning Profile: $PROFILE_NAME"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Fastlane iOS distribute
        env:
          ASC_API_KEY_ID:          ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID:       ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_CONTENT:     ${{ secrets.ASC_API_KEY_CONTENT }}
          IOS_BUNDLE_ID:           ${{ secrets.IOS_BUNDLE_ID }}
          IOS_DEVELOPMENT_TEAM_ID: ${{ secrets.IOS_DEVELOPMENT_TEAM_ID }}
          VERSION_NAME:            ${{ needs.version.outputs.name }}
          VERSION_CODE:            ${{ needs.version.outputs.code }}
          RELEASE_NOTES:           ${{ needs.version.outputs.release_notes }}
        run: bundle exec fastlane ios distribute

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/frontend/build/CashChatIOS.ipa
          retention-days: 7

      - name: Discord 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          TIMESTAMP:       ${{ github.event.head_commit.timestamp }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          VERSION_NAME:    ${{ needs.version.outputs.name }}
          VERSION_CODE:    ${{ needs.version.outputs.code }}
          RELEASE_NOTES:   ${{ needs.version.outputs.release_notes }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "ℹ️ DISCORD_WEBHOOK 없음 — 건너뜀" && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/v${VERSION_NAME}"
          NOTES_DISPLAY="${RELEASE_NOTES}"
          if [ ${#RELEASE_NOTES} -gt 800 ]; then
            NOTES_DISPLAY="${RELEASE_NOTES:0:800}...\n\n👉 [전체 릴리즈 노트](${RELEASE_URL})"
          fi
          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg ts "$TIMESTAMP" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            --arg version "v${VERSION_NAME} (build ${VERSION_CODE})" \
            --arg notes "$NOTES_DISPLAY" \
            --arg release_url "$RELEASE_URL" \
            '{embeds: [{
              color: 5763719,
              title: "✅  iOS 배포 완료",
              description: ("**TestFlight 업로드 성공**\n\n" + $notes),
              fields: [
                {name: "버전",         value: ("`" + $version + "`"), inline: true},
                {name: "배포자",       value: ("`" + $actor + "`"),   inline: true},
                {name: "커밋",         value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "GitHub Release", value: ("[릴리즈 페이지](" + $release_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · iOS Build"},
              timestamp: $ts
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Discord 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨  iOS 빌드/배포 실패",
              fields: [
                {name: "브랜치",      value: ("`" + $branch + "`"), inline: true},
                {name: "실패자",      value: ("`" + $actor + "`"),  inline: true},
                {name: "커밋",        value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "로그 확인",   value: ("[Actions 로그](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · iOS Build"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: GitHub Release 생성 (Android APK + AI 릴리즈 노트)
# ─────────────────────────────────────────────────────────────────────────────
  github-release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: GitHub Release 생성 및 APK 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.version.outputs.tag }}
          name:                   ${{ needs.version.outputs.tag }}
          body:                   ${{ needs.version.outputs.release_notes }}
          generate_release_notes: false
          files:                  release-assets/*.apk
          token:                  ${{ secrets.GITHUB_TOKEN }}
