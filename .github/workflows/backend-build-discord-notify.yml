name: 백엔드 빌드 알림

on:
  # Backend CI/CD 결과 알림 (workflow_run은 base repo 시크릿 접근 가능)
  workflow_run:
    workflows: ["Backend CI/CD"]
    types: [completed]

jobs:
  notify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 백엔드 빌드 체크 결과 알림
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ℹ️ DISCORD_WEBHOOK 없음 — 알림 건너뜀"
            exit 0
          fi
          if [ "$CONCLUSION" = "success" ]; then
            COLOR=5763719
            TITLE="✅ 백엔드 CI 빌드 체크 통과"
          else
            COLOR=15548997
            TITLE="🚨 백엔드 CI 빌드 체크 실패"
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg commit "$COMMIT_MSG" \
            --argjson color "$COLOR" \
            '{embeds: [{
              color: $color,
              title: $title,
              fields: [
                {name: "브랜치", value: ("`" + $branch + "` → `dev`"), inline: true},
                {name: "작성자", value: ("`" + $actor + "`"), inline: true},
                {name: "커밋 메시지", value: ("`" + $commit + "`"), inline: false},
                {name: "Actions 로그", value: ("[Actions 로그 바로가기](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat • 백엔드 빌드 체크"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
