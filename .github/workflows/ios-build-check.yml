name: iOS Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

concurrency:
  group: ios-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.build }}
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v5
      - name: Detect iOS-relevant changes
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          . .github/scripts/build/detect_build_changes.sh
          RANGE="$(changed_range)"
          echo "::notice::비교 범위 $RANGE"
          FILES=$(gh api "repos/${REPO}/compare/${RANGE}" --paginate -q '.files[].filename' 2>/dev/null || true)
          printf '변경 파일:\n%s\n' "$FILES"
          if printf '%s\n' "$FILES" | affects_ios; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "::notice::iOS 영향 변경 — 빌드 진행"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::iOS 영향 없음 — 빌드 잡 스킵"
          fi

  build-check:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: macos-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    defaults:
      run:
        working-directory: apps/frontend/CashChatIOS
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/frontend/CashChatIOS/CashChatIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Create Secrets.swift
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          API_SERVER_BASE_URL: ${{ secrets.API_SERVER_BASE_URL }}
        run: |
          cat > CashChatIOS/Secrets.swift << EOF
          // Auto-generated for CI build check
          // AdMob 값은 컴파일 검증용 Google 공식 테스트 ID (실 ID는 릴리즈 워크플로에서 주입)
          enum Secrets {
              static let googleIOSClientId = "$IOS_GOOGLE_CLIENT_ID"
              static let googleWebClientId = "$GOOGLE_CLIENT_ID"
              static let apiBaseUrl = "$API_SERVER_BASE_URL"
              static let admobAppId = "ca-app-pub-3940256099942544~1458002511"
              static let admobRewardedAdUnitId = "ca-app-pub-3940256099942544/1712485313"
              static let admobBannerAdUnitId = "ca-app-pub-3940256099942544/2934735716"
              static let admobInterstitialAdUnitId = "ca-app-pub-3940256099942544/4411468910"
              static let admobNativeAdUnitId = "ca-app-pub-3940256099942544/3986624511"
              static let tnkAppId = "00000000-0000-0000-0000-000000000000"
          }
          EOF
      - name: Write GoogleService-Info.plist (더미 — 컴파일/번들 검증용)
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # 실 plist 시크릿이 있으면 그대로, 없으면 더미로 폴백 (build-check는 실행하지 않으므로 내용은 무관)
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > CashChatIOS/GoogleService-Info.plist
          else
            cat > CashChatIOS/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>DUMMY_API_KEY</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.nomadlab.cashchat</string>
            <key>PROJECT_ID</key><string>cash-chat-dummy</string>
            <key>STORAGE_BUCKET</key><string>cash-chat-dummy.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          EOF
          fi
      - name: Build iOS app (simulator, 검증용)
        run: |
          xcodebuild \
            -project CashChatIOS.xcodeproj \
            -scheme CashChatIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
