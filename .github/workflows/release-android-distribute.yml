name: Android Release — Build & Distribute

on:
  push:
    branches:
      - 'release/android'

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: 버전 채번(Semantic, android/v* 태그 기준) + AI 릴리즈 노트 생성
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  version:
    if: github.repository == 'cash-chat-mvp/cash-chat-mvp'
    runs-on: ubuntu-latest
    outputs:
      name:          ${{ steps.ver.outputs.name }}
      code:          ${{ steps.ver.outputs.code }}
      tag:           ${{ steps.ver.outputs.tag }}
      prev_tag:      ${{ steps.ver.outputs.prev_tag }}
      release_notes: ${{ steps.ai_notes.outputs.notes }}
      ai_model:      ${{ steps.ai_notes.outputs.used_model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute semantic version & push tag
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── 기준 버전: android/v* git 태그 기반 ─────────────────────────────
          PLATFORM="android"
          LAST_TAG=$(git tag --list "${PLATFORM}/v*" --sort=-version:refname | head -1 || echo "")
          HAS_PREV_TAG=true
          if [ -z "$LAST_TAG" ]; then
            HAS_PREV_TAG=false
            LAST_TAG="${PLATFORM}/v0.0.0"
            echo "ℹ️ android 태그 없음 — 기준 v0.0.0 사용"
          fi
          LAST_VER="${LAST_TAG#${PLATFORM}/v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VER"
          echo "ℹ️ 기준 버전: ${LAST_TAG}"

          # ── 머지된 PR 정보 조회 (버전 동기화 + major 라벨 확인) ───────────
          MERGE_MSG=$(git log -1 --pretty=format:"%s")
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' 2>/dev/null || echo "")
          VERSION_FROM_PR=""
          HAS_MAJOR_LABEL="false"

          if [ -n "$PR_NUMBER" ]; then
            PR_DATA=$(curl -sf \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              2>/dev/null || echo "{}")
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
            VERSION_FROM_PR=$(echo "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | tr -d 'v' || echo "")
            PR_LABELS=$(echo "$PR_DATA" | jq -r '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            if echo "$PR_LABELS" | grep -qiE 'version\.major'; then
              HAS_MAJOR_LABEL="true"
            fi
          fi

          if [ -n "$VERSION_FROM_PR" ]; then
            NEW_VERSION="$VERSION_FROM_PR"
            echo "ℹ️ PR 제목에서 버전 추출: v${NEW_VERSION}"
          else
            # 커밋 수 기반 버전 계산 (마지막 android 태그 이후 커밋만)
            if [ "$HAS_PREV_TAG" = "true" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%B" --no-merges 2>/dev/null || echo "")
            else
              COMMITS=$(git log --pretty=format:"%B" --no-merges | head -200 || echo "")
            fi

            FEAT_COUNT=$(echo "$COMMITS" | grep -cE '^\[[^]]+\]\s+feat(\([^)]+\))?\s*[:：!]|^feat(\([^)]+\))?\s*[:：!]' 2>/dev/null) || FEAT_COUNT=0
            FIX_COUNT=$(echo "$COMMITS"  | grep -cE '^\[[^]]+\]\s+fix(\([^)]+\))?\s*[:：!]|^fix(\([^)]+\))?\s*[:：!]'   2>/dev/null) || FIX_COUNT=0
            BREAKING=$(echo "$COMMITS"   | grep -cE 'BREAKING[[:space:]]CHANGE|^feat(\([^)]+\))?!|^fix(\([^)]+\))?!' 2>/dev/null) || BREAKING=0

            if [ "$BREAKING" -gt 0 ] || [ "$HAS_MAJOR_LABEL" = "true" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$FEAT_COUNT" -gt 0 ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            elif [ "$FIX_COUNT" -gt 0 ]; then
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          # versionCode: MAJOR*1000000 + MINOR*1000 + PATCH (각 자리 최대 999까지 허용)
          IFS='.' read -r NM NMI NP <<< "$NEW_VERSION"
          VERSION_CODE=$(( NM * 1000000 + NMI * 1000 + NP ))

          if [ "$VERSION_CODE" -eq 0 ]; then
            echo "::error::VERSION_CODE 계산 실패 — NEW_VERSION=${NEW_VERSION}"
            exit 1
          fi

          # 태그 생성 및 푸시 (배포 전 선점 → 실패 시에도 버전 소비돼 중복 방지)
          NEW_TAG="${PLATFORM}/v${NEW_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "ℹ️ 로컬 태그 ${NEW_TAG} 이미 존재"
          else
            git tag -a "${NEW_TAG}" -m "chore: android release v${NEW_VERSION}"
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${NEW_TAG}^{}" 2>/dev/null | awk 'NR==1 {print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
              echo "::error::원격 태그 ${NEW_TAG}가 다른 커밋(${REMOTE_SHA})을 가리킵니다. 버전 충돌 가능성이 있습니다."
              exit 1
            fi
            echo "ℹ️ 원격 태그 ${NEW_TAG}가 현재 커밋을 가리킴 — 동일 커밋 재실행으로 간주, 푸시 스킵"
          else
            git push origin "${NEW_TAG}"
          fi

          echo "name=${NEW_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}"    >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}"          >> "$GITHUB_OUTPUT"
          echo "prev_tag=${LAST_TAG}"    >> "$GITHUB_OUTPUT"
          echo "✅ ${LAST_TAG} → ${NEW_TAG} (versionCode=${VERSION_CODE})"

      - name: Generate AI Release Notes
        id: ai_notes
        env:
          GOOGLE_GEMINI_API_KEY:  ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_MODELS:          ${{ vars.GEMINI_MODELS }}
          GEMINI_API_VERSION:     ${{ vars.GEMINI_API_VERSION }}
        run: |
          set -euo pipefail

          LAST_TAG="${{ steps.ver.outputs.prev_tag }}"
          if git rev-parse -q --verify "refs/tags/${LAST_TAG}" >/dev/null 2>&1; then
            ALL_COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null | head -50 || echo "")
          else
            ALL_COMMITS=$(git log --pretty=format:"%s" --no-merges | head -50 || echo "")
          fi

          fallback_notes() {
            local DELIM
            DELIM=$(uuidgen)
            { echo "notes<<$DELIM"; echo "$1"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
          }

          if [ -z "${GOOGLE_GEMINI_API_KEY:-}" ] || [ -z "$ALL_COMMITS" ]; then
            fallback_notes "Android v${{ steps.ver.outputs.name }} 새 빌드가 배포되었습니다."
            echo "used_model=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FEAT_COMMITS=$(echo "$ALL_COMMITS" | grep -E '^\[[^]]+\]\s+feat\s*[:：]|^feat\s*[:：]' | sed 's/^/  - /' || echo "  없음")
          FIX_COMMITS=$(echo "$ALL_COMMITS"  | grep -E '^\[[^]]+\]\s+fix\s*[:：]|^fix\s*[:：]'   | sed 's/^/  - /' || echo "  없음")
          OTHER_COMMITS=$(echo "$ALL_COMMITS" | grep -vE '^\[[^]]+\]\s+(feat|fix)\s*[:：]|^(feat|fix)\s*[:：]' | sed 's/^/  - /' || echo "  없음")

          PROMPT=$(jq -rn \
            --arg ver "${{ steps.ver.outputs.name }}" \
            --arg feat "$FEAT_COMMITS" \
            --arg fix  "$FIX_COMMITS" \
            --arg other "$OTHER_COMMITS" \
            '"Cash Chat Android 앱 v\($ver) 한국어 릴리즈 노트를 작성해주세요.\n\n[새 기능 커밋]\n\($feat)\n\n[버그 수정 커밋]\n\($fix)\n\n[기타 변경 커밋]\n\($other)\n\n작성 규칙:\n- 사용자가 직접 느끼는 변화만 작성\n- 개발자 용어·함수명·파일명 금지\n- QA·리팩토링·코드정리 언급 금지\n- 변경 유형을 다음 섹션 제목으로 묶어 작성하고, 해당하는 커밋이 없는 섹션은 통째로 생략:\n  ✨ 새로운 기능\n  🛠 개선\n  🐛 버그 수정\n- 각 섹션 아래 항목은 \"- \"로 시작하고, 무엇이 어떻게 좋아지는지 한 문장으로 구체적으로 설명\n- 비슷한 변경은 하나로 묶고, 전체 400자 내외로 작성"')

          GEMINI_API_VERSION="${GEMINI_API_VERSION:-v1beta}"
          MODELS_CSV="${GEMINI_MODELS:-gemini-2.5-flash,gemini-2.5-flash-lite,gemini-1.5-flash}"
          IFS=',' read -ra MODELS <<< "$MODELS_CSV"

          REQUEST_BODY=$(jq -n --arg p "$PROMPT" '{
            contents: [{"parts": [{"text": $p}]}],
            generationConfig: { temperature: 0.4 }
          }')

          HTTP_RESPONSE=$(mktemp)
          HTTP_CODE="000"
          USED_MODEL=""
          for model in "${MODELS[@]}"; do
            model="${model// /}"
            echo "::notice::Gemini 모델 시도: $model"
            HTTP_CODE=$(curl -s -o "$HTTP_RESPONSE" -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/${GEMINI_API_VERSION}/models/${model}:generateContent?key=${GOOGLE_GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              --data "$REQUEST_BODY") || HTTP_CODE="000"
            echo "::notice::Gemini API 응답 (모델: $model, HTTP $HTTP_CODE): $(head -c 500 "$HTTP_RESPONSE")"
            if [ "$HTTP_CODE" = "200" ]; then
              USED_MODEL="$model"
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::Gemini 429 ($model) — 60초 후 다음 모델로 전환"
              sleep 60
            elif [ "$HTTP_CODE" = "404" ]; then
              echo "::warning::Gemini 404 ($model) — 모델 없음, 다음 모델로 전환"
            else
              echo "::warning::Gemini $HTTP_CODE ($model) — 재시도 불가 오류, 중단"
              break
            fi
          done
          echo "used_model=${USED_MODEL}" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Gemini API 실패 (HTTP $HTTP_CODE)"
            fallback_notes "Android v${{ steps.ver.outputs.name }} 새 빌드가 배포되었습니다."
            exit 0
          fi

          NOTES=$(jq -r '.candidates[0].content.parts[0].text // empty' "$HTTP_RESPONSE" 2>/dev/null || echo "")
          if [ -z "$NOTES" ]; then
            echo "::warning::Gemini 응답 파싱 실패: $(head -c 300 "$HTTP_RESPONSE")"
            fallback_notes "Android v${{ steps.ver.outputs.name }} 새 빌드가 배포되었습니다."
            exit 0
          fi

          NOTES="${NOTES:0:800}"
          DELIM=$(uuidgen)
          { echo "notes<<$DELIM"; echo "$NOTES"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Android — Firebase App Distribution
# ─────────────────────────────────────────────────────────────────────────────
  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/frontend

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/frontend/**/*.gradle.kts', 'apps/frontend/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cashchat-release.keystore

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write local.properties
        env:
          ADMOB_APP_ID:                  ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID:       ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_NATIVE_AD_UNIT_ID:       ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID:     ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          # AdMob 실 ID 시크릿이 없으면 Google 공식 Android 테스트 ID로 폴백 (빌드/실행 실패 방지)
          ADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          ADMOB_BANNER_AD_UNIT_ID="${ADMOB_BANNER_AD_UNIT_ID:-ca-app-pub-3940256099942544/6300978111}"
          ADMOB_INTERSTITIAL_AD_UNIT_ID="${ADMOB_INTERSTITIAL_AD_UNIT_ID:-ca-app-pub-3940256099942544/1033173712}"
          ADMOB_NATIVE_AD_UNIT_ID="${ADMOB_NATIVE_AD_UNIT_ID:-ca-app-pub-3940256099942544/2247696110}"
          ADMOB_REWARDED_AD_UNIT_ID="${ADMOB_REWARDED_AD_UNIT_ID:-ca-app-pub-3940256099942544/5224354917}"
          echo "BASE_URL=${{ secrets.BASE_URL }}"                                                     >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"                                 >> local.properties
          echo "ADMOB_APP_ID=${ADMOB_APP_ID}"                                                         >> local.properties
          echo "ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID}"                                   >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID}"                       >> local.properties
          echo "ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID}"                                   >> local.properties
          echo "ADMOB_REWARDED_AD_UNIT_ID=${ADMOB_REWARDED_AD_UNIT_ID}"                               >> local.properties
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"                                                 >> local.properties
          echo "TNK_APP_ID=${{ secrets.TNK_APP_ID_ANDROID }}"                                         >> local.properties

      - name: Write Firebase Service Account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SA" > service-account.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Fastlane distribute (Android)
        env:
          KEYSTORE_PATH:           ${{ github.workspace }}/apps/frontend/cashchat-release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS:      ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD:   ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          FIREBASE_APP_ID:         ${{ secrets.FIREBASE_APP_ID }}
          VERSION_NAME:            ${{ needs.version.outputs.name }}
          VERSION_CODE:            ${{ needs.version.outputs.code }}
          RELEASE_NOTES:           ${{ needs.version.outputs.release_notes }}
        run: bundle exec fastlane android distribute

      - name: Find APK path
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK를 찾지 못했습니다"
            exit 1
          fi
          echo "path=$APK"               >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/frontend/${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Discord 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          TIMESTAMP:       ${{ github.event.head_commit.timestamp }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          VERSION_NAME:    ${{ needs.version.outputs.name }}
          VERSION_CODE:    ${{ needs.version.outputs.code }}
          RELEASE_NOTES:   ${{ needs.version.outputs.release_notes }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "ℹ️ DISCORD_WEBHOOK 없음 — 건너뜀" && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/android%2Fv${VERSION_NAME}"
          NOTES_DISPLAY="${RELEASE_NOTES}"
          if [ ${#RELEASE_NOTES} -gt 800 ]; then
            NOTES_DISPLAY="${RELEASE_NOTES:0:800}...\n\n👉 [전체 릴리즈 노트](${RELEASE_URL})"
          fi
          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg ts "$TIMESTAMP" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            --arg version "v${VERSION_NAME} (build ${VERSION_CODE})" \
            --arg notes "$NOTES_DISPLAY" \
            --arg release_url "$RELEASE_URL" \
            '{embeds: [{
              color: 5763719,
              title: "✅  Android 배포 완료",
              description: ("**Firebase App Distribution 배포 성공**\n\n" + $notes),
              fields: [
                {name: "버전",         value: ("`" + $version + "`"), inline: true},
                {name: "배포자",       value: ("`" + $actor + "`"),   inline: true},
                {name: "커밋",         value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "GitHub Release", value: ("[릴리즈 페이지](" + $release_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"},
              timestamp: $ts
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Discord 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DEPLOY_BOT_DISCORD }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" --arg branch "$BRANCH" --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" --arg sha "$SHORT_SHA" --arg commit_url "$COMMIT_URL" \
            '{embeds: [{
              color: 15548997,
              title: "🚨  Android 빌드/배포 실패",
              fields: [
                {name: "브랜치",      value: ("`" + $branch + "`"), inline: true},
                {name: "실패자",      value: ("`" + $actor + "`"),  inline: true},
                {name: "커밋",        value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                {name: "커밋 메시지", value: ("`" + $msg + "`"), inline: false},
                {name: "로그 확인",   value: ("[Actions 로그](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Cash Chat · Android Build"}
            }]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: GitHub Release 생성 (Android APK + AI 릴리즈 노트)
# ─────────────────────────────────────────────────────────────────────────────
  github-release:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: GitHub Release 생성 및 APK 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.version.outputs.tag }}
          name:                   "Android ${{ needs.version.outputs.tag }}"
          body:                   ${{ needs.version.outputs.release_notes }}
          generate_release_notes: false
          files:                  release-assets/*.apk
          token:                  ${{ secrets.GITHUB_TOKEN }}
