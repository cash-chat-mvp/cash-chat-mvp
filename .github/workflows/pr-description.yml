name: PR Description Auto Fill

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Commit List
        id: commits
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head"

          COMMITS=$(git log "origin/${BASE_REF}..pr-${PR_NUMBER}-head" \
            --no-merges \
            --first-parent \
            --pretty=format:"- %s (%h)" 2>/dev/null || \
            git log --no-merges --first-parent --pretty=format:"- %s (%h)" -10)

          if [ -z "$COMMITS" ]; then
            COMMITS="- 커밋 내역 없음"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "commits<<$EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # ── dev → release-fe 배포 PR 전용 처리 ─────────────────────────────
      - name: Compute version & AI release notes (dev → release-fe only)
        if: github.head_ref == 'dev' && github.base_ref == 'release-fe'
        id: release
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          PR_TITLE:        ${{ github.event.pull_request.title }}
          PR_NUMBER:       ${{ github.event.pull_request.number }}
          PR_LABELS_JSON:  ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # PR 제목에서 Jira 티켓 추출 (사용자가 입력한 값)
          ISSUE_KEY=$(echo "$PR_TITLE" | grep -oE 'CC-[0-9]+' | head -1 || true)
          echo "issue_key=${ISSUE_KEY}" >> "$GITHUB_OUTPUT"

          # ── Semantic version 계산 ────────────────────────────────────────
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head" 2>/dev/null || true

          # 현재 버전: GitHub Releases API (실제 마지막 배포 버전 기준)
          LAST_RELEASE=$(curl -sf \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            2>/dev/null || echo "{}")
          LAST_TAG=$(echo "$LAST_RELEASE" | jq -r '.tag_name // ""')
          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" = "null" ]; then
            LAST_TAG="v1.0.0"
          fi
          LAST_VER="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VER"

          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS_RAW=$(git log "pr-${PR_NUMBER}-head" --pretty=format:"%s" --no-merges 2>/dev/null || git log --pretty=format:"%s" --no-merges -50)
          else
            COMMITS_RAW=$(git log "${LAST_TAG}..pr-${PR_NUMBER}-head" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          fi

          # PR 라벨에서 major 제어 확인
          HAS_MAJOR_LABEL=$(echo "$PR_LABELS_JSON" | jq -r 'if type == "array" then map(select(test("version\\.major"; "i"))) | length > 0 else false end // false')

          # feat 수 → MINOR 증가 / fix 수 → PATCH 증가
          FEAT_COUNT=$(echo "$COMMITS_RAW" | grep -cE '^\[.*?\]\s+feat\s*[:：]|^feat\s*[:：]' 2>/dev/null || echo 0)
          FIX_COUNT=$(echo "$COMMITS_RAW"  | grep -cE '^\[.*?\]\s+fix\s*[:：]|^fix\s*[:：]'   2>/dev/null || echo 0)
          BREAKING=$(echo "$COMMITS_RAW"   | grep -cE 'BREAKING[[:space:]]CHANGE'              2>/dev/null || echo 0)
          FEAT_COUNT=$(( FEAT_COUNT + 0 ))
          FIX_COUNT=$(( FIX_COUNT + 0 ))
          BREAKING=$(( BREAKING + 0 ))

          if [ "$BREAKING" -gt 0 ] || [ "$HAS_MAJOR_LABEL" = "true" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$FEAT_COUNT" -gt 0 ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + FEAT_COUNT)).${FIX_COUNT}"
          elif [ "$FIX_COUNT" -gt 0 ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + FIX_COUNT))"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 예상 버전: ${LAST_TAG} → v${NEW_VERSION} (bump=${BUMP})"

          # ── Gemini AI 릴리즈 노트 생성 ──────────────────────────────────
          COMMIT_LIST=$(git log "${LAST_TAG}..pr-${PR_NUMBER}-head" \
            --pretty=format:"- %s" --no-merges 2>/dev/null | head -50 || echo "")

          if [ -z "${GOOGLE_GEMINI_API_KEY:-}" ] || [ -z "$COMMIT_LIST" ]; then
            NOTES="v${NEW_VERSION} 새 빌드가 배포될 예정입니다."
          else
            FEAT_COMMITS=$(echo "$COMMIT_LIST" | grep -E '^\[.*?\]\s+feat\s*[:：]|^feat\s*[:：]' | sed 's/^/  /' || echo "  없음")
          FIX_COMMITS=$(echo "$COMMIT_LIST"  | grep -E '^\[.*?\]\s+fix\s*[:：]|^fix\s*[:：]'   | sed 's/^/  /' || echo "  없음")
          OTHER_COMMITS=$(echo "$COMMIT_LIST" | grep -vE '^\[.*?\]\s+(feat|fix)\s*[:：]|^(feat|fix)\s*[:：]' | sed 's/^/  /' || echo "  없음")

          PROMPT="Cash Chat 앱 v${NEW_VERSION} 한국어 릴리즈 노트를 작성해주세요.

[새 기능 커밋]
${FEAT_COMMITS}

[버그 수정 커밋]
${FIX_COMMITS}

[기타 변경 커밋]
${OTHER_COMMITS}

작성 규칙:
- 사용자 관점에서 실제 체감 변화 중심으로 설명
- 이모지로 시작하는 불릿 포인트 3~5줄
- 함수명·파일명 등 기술 내부 상세 제외
- 전체 200자 이내로 간결하게
- 변경사항 없는 섹션은 릴리즈 노트에서 생략"

            RESPONSE=$(curl -sf \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GOOGLE_GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              --data "$(jq -n --arg p "$PROMPT" '{contents: [{"parts": [{"text": $p}]}]}')" \
              || echo '{"candidates":[{"content":{"parts":[{"text":"새로운 빌드가 배포될 예정입니다."}]}}]}')

            NOTES=$(echo "$RESPONSE" \
              | jq -r '.candidates[0].content.parts[0].text // "새로운 빌드가 배포될 예정입니다."')
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Fill Release PR title & body (dev → release-fe only)
        if: github.head_ref == 'dev' && github.base_ref == 'release-fe'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueKey = ${{ toJSON(steps.release.outputs.issue_key) }};
            const version  = ${{ toJSON(steps.release.outputs.version) }};
            const notes    = ${{ toJSON(steps.release.outputs.notes) }};
            const commits  = ${{ toJSON(steps.commits.outputs.commits) }};

            const prefix = issueKey ? `[${issueKey}] ` : '';
            const newTitle = `${prefix}CashChat - RELEASE : v${version}`;

            const jiraUrl = issueKey
              ? `https://moneyfactoryslave.atlassian.net/browse/${issueKey}`
              : null;

            const body = [
              '## 🚀 릴리즈 PR',
              jiraUrl ? `연관 Jira: [${issueKey}](${jiraUrl})` : '',
              '',
              '## 📣 릴리즈 노트 (AI 생성)',
              notes,
              '',
              '## 📝 포함 커밋',
              commits,
              '',
              '## ✅ 배포 전 체크리스트',
              '- [ ] Android 빌드 정상 확인',
              '- [ ] iOS 빌드 정상 확인',
              '- [ ] Firebase App Distribution 테스터 배포 확인',
              '- [ ] TestFlight 업로드 확인',
            ].filter(line => line !== null).join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: newTitle,
              body: body.trim()
            });
            console.log(`✅ 릴리즈 PR 설정 완료 — "${newTitle}"`);

      # ── 일반 PR 처리 ────────────────────────────────────────────────────
      - name: Extract Jira Issue Key
        if: github.head_ref != 'dev' || github.base_ref != 'release-fe'
        id: extract
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ISSUE_KEY=$(echo "${HEAD_REF} ${PR_TITLE}" \
            | grep -oE 'CC-[0-9]+' | head -1)
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

      - name: Update PR Title
        if: github.head_ref != 'dev' || github.base_ref != 'release-fe'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueKey = ${{ toJSON(steps.extract.outputs.issue_key) }};
            const currentTitle = context.payload.pull_request.title;

            if (/^\[CC-\d+\]\s+\S.*/.test(currentTitle)) {
              console.log('✅ 제목 이미 올바른 형식:', currentTitle);
              return;
            }

            if (!issueKey) {
              console.log('⚠️ Jira 티켓 번호를 찾을 수 없어 제목을 수정하지 않습니다.');
              return;
            }

            const cleanTitle = currentTitle.replace(/CC-\d+\s*/g, '').trim();
            const newTitle = `[${issueKey}] ${cleanTitle}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: newTitle
            });
            console.log(`✅ 제목 변경: "${currentTitle}" → "${newTitle}"`);

      - name: Update PR Description
        if: github.head_ref != 'dev' || github.base_ref != 'release-fe'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueKey = ${{ toJSON(steps.extract.outputs.issue_key) }};
            const commits = ${{ toJSON(steps.commits.outputs.commits) }};

            const jiraUrl = issueKey
              ? `https://moneyfactoryslave.atlassian.net/browse/${issueKey}`
              : '없음';

            const checklist = [
              '- [ ] 코드 리뷰 요청 전 셀프 리뷰 완료',
              '- [ ] 테스트 확인',
              '- [ ] 불필요한 코드/주석 제거',
            ].join('\n');

            const body = [
              '## 📋 연관 Jira 티켓',
              issueKey ? `[${issueKey}](${jiraUrl})` : '없음',
              '',
              '## 📝 커밋 내역',
              commits,
              '',
              '## ✅ 체크리스트',
              checklist,
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body.trim()
            });
