                -e 's/## Incremental PR Reviewer Guide/## 증분 PR 리뷰 가이드/g' \
                -e 's/## PR Reviewer Guide/## PR 리뷰 가이드/g' \
                -e 's/Here are some key observations to aid the review process:/리뷰에 참고할 주요 관찰 사항입니다:/g' \
                -e 's/Estimated effort to review/리뷰 예상 난이도/g' \
                -e 's/No relevant tests/관련 테스트 없음/g' \
                -e 's/PR contains tests/테스트 포함됨/g' \
                -e 's/No security concerns identified/보안 이슈 없음/g' \
                -e 's/Security concerns/보안 이슈/g' \
                -e 's/No major issues detected/주요 이슈 없음/g' \
                -e 's/Recommended focus areas for review/중점 리뷰 영역/g' \
                -e 's/No TODO sections/TODO 섹션 없음/g' \
                -e 's/TODO sections/TODO 섹션/g' \
                -e 's/Contribution time estimate/기여 소요 시간 추정/g' \
                -e 's/Ticket compliance check/티켓 준수 확인/g' \
                -e 's/Relevant ticket/관련 티켓/g')
              curl -s -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api/issues/comments/${rid}" -d "$(jq -n --arg b "$body" '{body: $b}')" >/dev/null
            fi
            sid=$(printf '%s' "$comments" | jq -r '[.[] | select(.body != null and (.body | test("PR Code Suggestions")))] | last | .id // empty')
            if [ -n "$sid" ]; then
              body=$(printf '%s' "$comments" | jq -r --argjson id "$sid" '.[] | select(.id==$id) | .body' | sed \
                -e 's/## PR Code Suggestions/## PR 코드 개선 제안/g' \
                -e 's/No code suggestions found for the PR./✅ 개선할 점을 찾지 못했어요 — 코드가 깔끔합니다! 👍 (사용량 소진이 아닌 정상 완료입니다)/g' \
                -e 's#<strong>Category</strong>#<strong>분류</strong>#g' \
                -e 's/<strong>Suggestion/<strong>제안/g' \
                -e 's#<strong>Impact</strong>#<strong>영향도</strong>#g' \
                -e 's/Suggestion importance\[1-10\]:/제안 중요도[1-10]:/g' \
                -e 's/Why: /이유: /g')
              curl -s -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api/issues/comments/${sid}" -d "$(jq -n --arg b "$body" '{body: $b}')" >/dev/null
            fi
          }
          # 각 명령 직후 소프트 사용량 소진 검사 (/review 단계 누락 방지)
          check_soft_quota() {
            local log="$1"
            if grep -qiE "RESOURCE_EXHAUSTED|free_tier|quota|rate.?limit|429" "$log"; then
              delete_no_suggestions_comment
              notify_failure "$log"
              echo "::error::사용량 소진(소프트) — 로그를 확인하세요"
              exit 1
            fi
          }
          cleanup_notices
          # 리뷰 진행 중 안내 — 완료/실패와 무관하게 trap으로 자동 삭제
          PROGRESS_ID=""
          clear_progress() {
            if [ -n "${PROGRESS_ID:-}" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/${PROGRESS_ID}" >/dev/null || true
              PROGRESS_ID=""
            fi
          }
          trap clear_progress EXIT
          PROGRESS_BODY=$(printf '## 🔍 AI 코드 리뷰를 진행하고 있어요\n\n⏳ 변경된 코드를 살펴보는 중입니다 — 보통 1~2분 정도 걸려요.\n\n리뷰가 끝나면 이 안내는 자동으로 사라지고 결과가 게시됩니다.')
          PROGRESS_ID=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --arg b "$PROGRESS_BODY" '{body:$b}')" | jq -r '.id // empty' || true)
          run_command "/review"
          check_soft_quota "$LAST_LOG"
          run_command "/improve"
          check_soft_quota "$LAST_LOG"
          localize_comments

  # ====================================================
  # 티키타카 대화 (/ask) — PR 전체 및 라인 댓글, model_weak 사용
  # ====================================================
  ask-gemini:
    name: Gemini Ask
    needs: resolve-gemini-model
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/ask')) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '/ask'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Gemini bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GEMINI_BOT_APP_ID }}
          private-key: ${{ secrets.GEMINI_BOT_PRIVATE_KEY }}
      - name: Resolve commenter key
        id: whichkey
        env:
          LOGIN: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          login_lc=$(printf '%s' "$LOGIN" | tr '[:upper:]' '[:lower:]')
          case "$login_lc" in
            gudals-kim) s=GUDALS ;;
            seedplan005|jwchoi42) s=CHOI ;;
            jeonj95|unistuj) s=JEON ;;
            *) s="" ;;
          esac
          echo "suffix=$s" >> "$GITHUB_OUTPUT"
          echo "::notice::/ask 키 소유자: ${s:-공용(기본)}"
      - name: Ask (Gemini, model_weak)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          MODEL0: ${{ needs.resolve-gemini-model.outputs.model0 }}
          MODEL1: ${{ needs.resolve-gemini-model.outputs.model1 }}
          # 명령(/ask) 작성자별 키(미매핑 시 빈 값 → 아래 run에서 공용 키로 폴백)
          MAPPED_KEY: ${{ secrets[format('GEMINI_KEY_{0}', steps.whichkey.outputs.suffix)] }}
          DEFAULT_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          # 명령(/ask) 작성자의 키 사용, 미매핑 시 공용 키로 폴백
          GEMINI_KEY="${MAPPED_KEY:-$DEFAULT_KEY}"
          # /ask 는 ModelType.WEAK → CONFIG.MODEL_WEAK(=model1) 사용.
          # 코멘트 본문은 rewrite 하지 않고 그대로 pr-agent 러너가 파싱한다.
          LOG=$(mktemp)
          set +e
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_API_URL="${{ github.api_url }}" \
            -e GITHUB_SERVER_URL="${{ github.server_url }}" \
            -e GITHUB_EVENT_PATH=/github/workflow/event.json \
            -e "CONFIG.AI_PROVIDER=google_ai_studio" \
            -e "CONFIG.MODEL=$MODEL0" \
            -e "CONFIG.MODEL_WEAK=$MODEL1" \
            -e "CONFIG.FALLBACK_MODELS=[]" \
            -e "GOOGLE_AI_STUDIO.GEMINI_API_KEY=$GEMINI_KEY" \
            -e "GEMINI_API_KEY=$GEMINI_KEY" \
            -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            "$PR_AGENT_IMAGE" 2>&1 | tee "$LOG"
          docker_status=${PIPESTATUS[0]}
          set -e
          if [ "$docker_status" -ne 0 ] || grep -qE "$PR_AGENT_FAIL_MARKERS" "$LOG" || grep -qiE "RESOURCE_EXHAUSTED|free_tier|quota|rate.?limit|429" "$LOG"; then
            PR_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
            api="${GITHUB_API_URL}/repos/${{ github.repository }}"
            msg='답변 생성에 실패했어요. 사용량 소진일 수 있어요 — 잠시 후 다시 `/ask` 로 질문해 주세요. 🙏'
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/issues/${PR_NUM}/comments" -d "$(jq -n --arg b "$msg" '{body:$b}')" >/dev/null
            echo "::error::/ask 실패"
            exit 1
          fi
