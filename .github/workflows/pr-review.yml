name: PR Code Review (Qodo / pr-agent)

# 공통 리뷰 설정은 레포 루트의 .pr_agent.toml 에서 관리합니다.
# 이 워크플로우는 트리거·프로바이더·모델·봇 토큰만 다룹니다.

on:
  # Gemini 자동: dev 브랜치로 PR 생성/재오픈/커밋 푸시 시
  # fork PR에서 secrets 접근을 위해 pull_request_target 사용
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - dev
  # 수동: PR 코멘트 명령어 (/gemini-review, /openai-review)
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  # ====================================================
  # Gemini: 사용 가능한 모델 순차 탐색 (자동·수동 공용)
  # ====================================================
  resolve-gemini-model:
    name: Resolve Gemini Model
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/gemini-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      model: ${{ steps.pick.outputs.model }}
    steps:
      - name: Pick available Gemini model
        id: pick
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
        run: |
          set -euo pipefail
          API_VERSION="${GEMINI_API_VERSION:-v1beta}"
          MODELS_CSV="${GEMINI_MODELS:-gemini-2.5-flash}"
          IFS=',' read -ra MODELS <<< "$MODELS_CSV"

          SELECTED=""
          for model in "${MODELS[@]}"; do
            model="${model// /}"
            echo "::notice::Gemini 모델 시도: $model"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 20 \
              "https://generativelanguage.googleapis.com/${API_VERSION}/models/${model}:generateContent?key=${GOOGLE_GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              --data '{"contents":[{"parts":[{"text":"hi"}]}]}') || HTTP_CODE="000"
            echo "::notice::HTTP $HTTP_CODE ($model)"
            if [ "$HTTP_CODE" = "200" ]; then
              SELECTED="$model"
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::429 ($model) — 다음 모델로 전환"
              sleep 5
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 Gemini 모델 없음"
            exit 1
          fi

          echo "model=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "::notice::선택된 Gemini 모델: $SELECTED"

  # ====================================================
  # Gemini 자동 리뷰 (PR 생성/커밋 푸시)
  # ====================================================
  review-gemini-auto:
    name: Gemini Auto Review
    needs: resolve-gemini-model
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Gemini bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GEMINI_BOT_APP_ID }}
          private-key: ${{ secrets.GEMINI_BOT_PRIVATE_KEY }}
      - name: AI Code Review (Gemini)
        uses: Codium-ai/pr-agent@751af2422bef9be99fa605734c058c1c9bc1b3fa
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONFIG.AI_PROVIDER: "google"
          CONFIG.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GOOGLE_AI_STUDIO.KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"

  # ====================================================
  # Gemini 수동 리뷰 (/gemini-review 코멘트)
  # 코멘트 본문을 /review, /improve 로 바꿔치기 후 실행
  # ====================================================
  review-gemini-manual:
    name: Gemini Manual Review
    needs: resolve-gemini-model
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/gemini-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Gemini bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GEMINI_BOT_APP_ID }}
          private-key: ${{ secrets.GEMINI_BOT_PRIVATE_KEY }}
      - name: Override comment to /review
        run: |
          tmp=$(mktemp)
          jq '.comment.body = "/review"' "$GITHUB_EVENT_PATH" > "$tmp"
          mv "$tmp" "$GITHUB_EVENT_PATH"
      - name: AI Review (Gemini)
        uses: Codium-ai/pr-agent@751af2422bef9be99fa605734c058c1c9bc1b3fa
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONFIG.AI_PROVIDER: "google"
          CONFIG.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GOOGLE_AI_STUDIO.KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
      - name: Override comment to /improve
        run: |
          tmp=$(mktemp)
          jq '.comment.body = "/improve"' "$GITHUB_EVENT_PATH" > "$tmp"
          mv "$tmp" "$GITHUB_EVENT_PATH"
      - name: AI Improve (Gemini)
        uses: Codium-ai/pr-agent@751af2422bef9be99fa605734c058c1c9bc1b3fa
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONFIG.AI_PROVIDER: "google"
          CONFIG.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GOOGLE_AI_STUDIO.KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO.MODEL: ${{ needs.resolve-gemini-model.outputs.model }}

  # ====================================================
  # OpenAI: 사용 가능한 모델 순차 탐색 (수동 전용)
  # ====================================================
  resolve-openai-model:
    name: Resolve OpenAI Model
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/openai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      model: ${{ steps.pick.outputs.model }}
    steps:
      - name: Pick available OpenAI model
        id: pick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODELS: ${{ vars.OPENAI_MODELS }}
        run: |
          set -euo pipefail
          MODELS_CSV="${OPENAI_MODELS:-gpt-4o}"
          IFS=',' read -ra MODELS <<< "$MODELS_CSV"

          SELECTED=""
          for model in "${MODELS[@]}"; do
            model="${model// /}"
            echo "::notice::OpenAI 모델 시도: $model"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 20 \
              "https://api.openai.com/v1/chat/completions" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -H "content-type: application/json" \
              --data "{\"model\":\"${model}\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}") || HTTP_CODE="000"
            echo "::notice::HTTP $HTTP_CODE ($model)"
            if [ "$HTTP_CODE" = "200" ]; then
              SELECTED="$model"
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::429 ($model) — 다음 모델로 전환"
              sleep 5
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 OpenAI 모델 없음"
            exit 1
          fi

          echo "model=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "::notice::선택된 OpenAI 모델: $SELECTED"

  # ====================================================
  # OpenAI 수동 리뷰 (/openai-review 코멘트)
  # ====================================================
  review-openai-manual:
    name: OpenAI Manual Review
    needs: resolve-openai-model
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate OpenAI bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPENAI_BOT_APP_ID }}
          private-key: ${{ secrets.OPENAI_BOT_PRIVATE_KEY }}
      - name: Override comment to /review
        run: |
          tmp=$(mktemp)
          jq '.comment.body = "/review"' "$GITHUB_EVENT_PATH" > "$tmp"
          mv "$tmp" "$GITHUB_EVENT_PATH"
      - name: AI Review (OpenAI)
        uses: Codium-ai/pr-agent@751af2422bef9be99fa605734c058c1c9bc1b3fa
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONFIG.AI_PROVIDER: "openai"
          CONFIG.MODEL: ${{ needs.resolve-openai-model.outputs.model }}
          OPENAI.KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI.MODEL: ${{ needs.resolve-openai-model.outputs.model }}
      - name: Override comment to /improve
        run: |
          tmp=$(mktemp)
          jq '.comment.body = "/improve"' "$GITHUB_EVENT_PATH" > "$tmp"
          mv "$tmp" "$GITHUB_EVENT_PATH"
      - name: AI Improve (OpenAI)
        uses: Codium-ai/pr-agent@751af2422bef9be99fa605734c058c1c9bc1b3fa
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONFIG.AI_PROVIDER: "openai"
          CONFIG.MODEL: ${{ needs.resolve-openai-model.outputs.model }}
          OPENAI.KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI.MODEL: ${{ needs.resolve-openai-model.outputs.model }}
