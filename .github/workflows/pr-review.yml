name: PR Code Review (Qodo / pr-agent)

# 공통 리뷰 설정은 레포 루트의 .pr_agent.toml 에서 관리합니다.
# 이 워크플로우는 트리거·프로바이더·모델·봇 토큰만 다룹니다.
#
# pr-agent는 내부 에러가 나도 항상 정상 종료(exit 0)하므로,
# uses: 액션 대신 docker run 으로 직접 실행하고 로그에서 실패 마커를
# 감지해 job을 실패(빨간 X)로 표시합니다.
# 이미지는 공급망 보안을 위해 digest로 핀닝합니다.

on:
  # Gemini 자동: dev 브랜치로 PR 생성/재오픈/커밋 푸시 시
  # fork PR에서 secrets 접근을 위해 pull_request_target 사용
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - dev
  # 수동: PR 코멘트 명령어 (/gemini-review, /openai-review)
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  # pr-agent 이미지 digest 핀닝 (uses: Codium-ai/pr-agent 가 내부적으로 쓰는 베이스 이미지)
  PR_AGENT_IMAGE: "pragent/pr-agent@sha256:70e78800a3ee94ee31a25e43d3b8ef25e8e8fda7ccacfd765f911c9f66b6b048"
  # 리뷰 실패로 간주할 pr-agent 로그 마커 (최종 실패 메시지만)
  PR_AGENT_FAIL_MARKERS: "Failed to review PR:|Failed to generate code suggestions for PR, error:|Failed to generate prediction with any model"

jobs:
  # ====================================================
  # Gemini: 사용 가능한 모델 순차 탐색 (자동·수동 공용)
  # ====================================================
  resolve-gemini-model:
    name: Resolve Gemini Model
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/gemini-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      model: ${{ steps.pick.outputs.model }}
    steps:
      - name: Pick available Gemini model
        id: pick
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
        run: |
          set -euo pipefail
          API_VERSION="${GEMINI_API_VERSION:-v1beta}"
          MODELS_CSV="${GEMINI_MODELS:-gemini-2.5-flash}"
          IFS=',' read -ra MODELS <<< "$MODELS_CSV"

          SELECTED=""
          for model in "${MODELS[@]}"; do
            model="${model// /}"
            echo "::notice::Gemini 모델 시도: $model"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 20 \
              "https://generativelanguage.googleapis.com/${API_VERSION}/models/${model}:generateContent?key=${GOOGLE_GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              --data '{"contents":[{"parts":[{"text":"hi"}]}]}') || HTTP_CODE="000"
            echo "::notice::HTTP $HTTP_CODE ($model)"
            if [ "$HTTP_CODE" = "200" ]; then
              SELECTED="$model"
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::429 ($model) — 다음 모델로 전환"
              sleep 5
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 Gemini 모델 없음"
            exit 1
          fi

          echo "model=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "::notice::선택된 Gemini 모델: $SELECTED"

  # ====================================================
  # Gemini 자동 리뷰 (PR 생성/커밋 푸시)
  # ====================================================
  review-gemini-auto:
    name: Gemini Auto Review
    needs: resolve-gemini-model
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Gemini bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GEMINI_BOT_APP_ID }}
          private-key: ${{ secrets.GEMINI_BOT_PRIVATE_KEY }}
      - name: AI Review + Improve (Gemini)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GEMINI_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_API_URL="${{ github.api_url }}" \
            -e GITHUB_SERVER_URL="${{ github.server_url }}" \
            -e GITHUB_EVENT_PATH=/github/workflow/event.json \
            -e "CONFIG.AI_PROVIDER=google_ai_studio" \
            -e "CONFIG.MODEL=gemini/$MODEL" \
            -e "GOOGLE_AI_STUDIO.GEMINI_API_KEY=$GEMINI_KEY" \
            -e "GEMINI_API_KEY=$GEMINI_KEY" \
            -e "GITHUB_ACTION_CONFIG.AUTO_REVIEW=true" \
            -e "GITHUB_ACTION_CONFIG.AUTO_DESCRIBE=false" \
            -e "GITHUB_ACTION_CONFIG.AUTO_IMPROVE=true" \
            -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            "$PR_AGENT_IMAGE" 2>&1 | tee "$LOG"
          if grep -qE "$PR_AGENT_FAIL_MARKERS" "$LOG"; then
            echo "::error::Gemini 리뷰 실패 — 로그를 확인하세요"
            exit 1
          fi

  # ====================================================
  # Gemini 수동 리뷰 (/gemini-review 코멘트)
  # 코멘트 본문을 /review, /improve 로 바꿔치기 후 실행
  # ====================================================
  review-gemini-manual:
    name: Gemini Manual Review
    needs: resolve-gemini-model
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/gemini-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Gemini bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GEMINI_BOT_APP_ID }}
          private-key: ${{ secrets.GEMINI_BOT_PRIVATE_KEY }}
      - name: AI Review + Improve (Gemini)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          MODEL: ${{ needs.resolve-gemini-model.outputs.model }}
          GEMINI_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          run_command() {
            local cmd="$1"
            local tmp; tmp=$(mktemp)
            jq --arg c "$cmd" '.comment.body = $c' "$GITHUB_EVENT_PATH" > "$tmp"
            mv "$tmp" "$GITHUB_EVENT_PATH"
            local log; log=$(mktemp)
            docker run --rm \
              -e GITHUB_TOKEN \
              -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
              -e GITHUB_REPOSITORY="${{ github.repository }}" \
              -e GITHUB_API_URL="${{ github.api_url }}" \
              -e GITHUB_SERVER_URL="${{ github.server_url }}" \
              -e GITHUB_EVENT_PATH=/github/workflow/event.json \
              -e "CONFIG.AI_PROVIDER=google_ai_studio" \
              -e "CONFIG.MODEL=gemini/$MODEL" \
              -e "GOOGLE_AI_STUDIO.GEMINI_API_KEY=$GEMINI_KEY" \
              -e "GEMINI_API_KEY=$GEMINI_KEY" \
              -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
              "$PR_AGENT_IMAGE" 2>&1 | tee "$log"
            if grep -qE "$PR_AGENT_FAIL_MARKERS" "$log"; then
              echo "::error::Gemini $cmd 실패 — 로그를 확인하세요"
              exit 1
            fi
          }
          run_command "/review"
          run_command "/improve"

  # ====================================================
  # OpenAI: 사용 가능한 모델 순차 탐색 (수동 전용)
  # ====================================================
  resolve-openai-model:
    name: Resolve OpenAI Model
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/openai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      model: ${{ steps.pick.outputs.model }}
    steps:
      - name: Pick available OpenAI model
        id: pick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODELS: ${{ vars.OPENAI_MODELS }}
        run: |
          set -euo pipefail
          MODELS_CSV="${OPENAI_MODELS:-gpt-4o}"
          IFS=',' read -ra MODELS <<< "$MODELS_CSV"

          SELECTED=""
          for model in "${MODELS[@]}"; do
            model="${model// /}"
            echo "::notice::OpenAI 모델 시도: $model"
            # 모델 존재 여부만 확인 (chat 파라미터 호환성 이슈 회피: gpt-5.x는 max_tokens 미지원)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 20 \
              "https://api.openai.com/v1/models/${model}" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}") || HTTP_CODE="000"
            echo "::notice::HTTP $HTTP_CODE ($model)"
            if [ "$HTTP_CODE" = "200" ]; then
              SELECTED="$model"
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::429 ($model) — 다음 모델로 전환"
              sleep 5
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 OpenAI 모델 없음"
            exit 1
          fi

          echo "model=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "::notice::선택된 OpenAI 모델: $SELECTED"

  # ====================================================
  # OpenAI 수동 리뷰 (/openai-review 코멘트)
  # ====================================================
  review-openai-manual:
    name: OpenAI Manual Review
    needs: resolve-openai-model
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate OpenAI bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPENAI_BOT_APP_ID }}
          private-key: ${{ secrets.OPENAI_BOT_PRIVATE_KEY }}
      - name: AI Review + Improve (OpenAI)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          MODEL: ${{ needs.resolve-openai-model.outputs.model }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          run_command() {
            local cmd="$1"
            local tmp; tmp=$(mktemp)
            jq --arg c "$cmd" '.comment.body = $c' "$GITHUB_EVENT_PATH" > "$tmp"
            mv "$tmp" "$GITHUB_EVENT_PATH"
            local log; log=$(mktemp)
            docker run --rm \
              -e GITHUB_TOKEN \
              -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
              -e GITHUB_REPOSITORY="${{ github.repository }}" \
              -e GITHUB_API_URL="${{ github.api_url }}" \
              -e GITHUB_SERVER_URL="${{ github.server_url }}" \
              -e GITHUB_EVENT_PATH=/github/workflow/event.json \
              -e "CONFIG.AI_PROVIDER=openai" \
              -e "CONFIG.MODEL=$MODEL" \
              -e "OPENAI.KEY=$OPENAI_KEY" \
              -e "OPENAI_API_KEY=$OPENAI_KEY" \
              -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
              "$PR_AGENT_IMAGE" 2>&1 | tee "$log"
            if grep -qE "$PR_AGENT_FAIL_MARKERS" "$log"; then
              echo "::error::OpenAI $cmd 실패 — 로그를 확인하세요"
              exit 1
            fi
          }
          run_command "/review"
          run_command "/improve"
