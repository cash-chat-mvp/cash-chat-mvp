let activeFilter = 'all';

function filterCards(cat) {
  activeFilter = cat;
  document.querySelectorAll('[id^="btn-"]').forEach(b => {
    b.style.background = 'transparent';
    b.style.color = 'var(--color-text-primary)';
    b.style.border = '0.5px solid var(--color-border-secondary)';
  });
  const btn = document.getElementById('btn-' + cat);
  if (btn) {
    btn.style.background = 'var(--color-text-primary)';
    btn.style.color = 'var(--color-background-primary)';
  }
  renderCards();
}

  const grid = document.getElementById('card-grid');

  grid.innerHTML = filtered.map(c => `
    <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; display: flex; flex-direction: column; gap: 8px; cursor: pointer;" onclick="sendPrompt('${c.title} 기능을 더 자세히 설계해줘 — 채팅 UX, 백엔드 구조, API 활용 방법 포함해서')">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <i class="ti ${c.icon}" style="font-size: 20px; color: var(--color-text-secondary);" aria-hidden="true"></i>
        <span style="font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: ${c.levelBg}; color: ${c.levelColor};">${c.level}</span>
      </div>
      <div>
        <p style="font-size: 14px; font-weight: 500; margin: 0 0 4px; color: var(--color-text-primary);">${c.title}</p>
        <p style="font-size: 12px; color: var(--color-text-secondary); margin: 0; line-height: 1.5;">${c.desc}</p>
      </div>
      <div style="border-top: 0.5px solid var(--color-border-tertiary); padding-top: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--color-text-tertiary);">${c.api}</span>
        <span style="font-size: 11px; font-weight: 500; color: var(--color-text-secondary);">${c.phase}</span>

    </div>
