<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>와이어프레임 뷰어 — Cash Chat Admin v0.2</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',sans-serif}
body{display:flex;height:100vh;background:#f5f5f5;font-size:13px;color:#333}

</style></head><body>
<div class="stage"><div class="stagehd">Cash Chat Admin 와이어프레임 <small>lo-fi · v0.2 · 페이지를 오른쪽에서 선택</small></div>
<iframe id="fr" src="pages/01-dashboard-overview/index.html"></iframe></div>

<div class="info"><h3 id="ititle"></h3><p id="idesc"></p><div id="itags"></div></div></div>
<script>
const PAGES = [{"slug": "00-login", "group": "(셸 밖)", "title": "로그인", "reqs": ["REQ-001", "REQ-004"], "desc": "관리자 전용 로그인. 실패 응답 동일화, 잠금, 세션 유휴 만료, MFA(TOTP) 확장.", "stories": ["REQ-001 CC-582", "REQ-004 CC-585"]}, {"slug": "01-dashboard-overview", "group": "대시보드", "title": "운영 현황", "reqs": ["REQ-008"], "desc": "운영자가 서비스 핵심 현황(가입·활동·보상·매출)을 한 화면에서 파악한다.", "stories": ["REQ-008 CC-589"]}, {"slug": "02-dashboard-users", "group": "대시보드", "title": "회원·활동 지표", "reqs": ["REQ-009"], "desc": "회원 활성 지표(DAU·WAU·MAU·신규·이탈)를 기간별로 조회·비교한다. 활동 이벤트 정의는 UNR-006.", "stories": ["REQ-009 CC-590"]}, {"slug": "03-dashboard-economy", "group": "대시보드", "title": "보상 경제·재무 지표", "reqs": ["REQ-010"], "desc": "운영자가 일일 매출 및 포인트 흐름 등 재무 지표를 빠르게 파악한다. 전일·전주·전월 대비 변동 비교.", "stories": ["REQ-010 CC-591"]}, {"slug": "04-dashboard-ai-cost", "group": "대시보드", "title": "AI 비용 지표", "reqs": ["REQ-011", "REQ-031"], "desc": "AI 토큰 사용량·비용을 모델별·기간별로 조회한다. 단가 데이터 소유는 UNR-003.", "stories": ["REQ-011 CC-592", "REQ-031 CC-612"]}, {"slug": "05-members", "group": "회원 관리", "title": "회원 목록·검색", "reqs": ["REQ-012"], "desc": "닉네임·이메일·회원ID 등으로 회원을 검색하고 목록을 조회한다.", "stories": ["REQ-012 CC-593"]}, {"slug": "06-member-detail", "group": "회원 관리", "title": "회원 상세", "reqs": ["REQ-013", "REQ-015", "REQ-016", "REQ-017"], "desc": "회원 1명의 프로필·활동·자산·로그인 기기·위험 표시·내부 메모를 탭으로 통합 조회한다. 민감정보는 마스킹 기본, 원본 조회 시 감사 기록.", "stories": ["REQ-013 CC-594", "REQ-015 CC-596", "REQ-016 CC-597", "REQ-017 CC-598"]}, {"slug": "07-sanctions", "group": "회원 관리", "title": "이용 제재", "reqs": ["REQ-014"], "desc": "회원 제재(경고·일시 정지·영구 정지)를 등록·해제하고 이력을 조회한다. 자동 제재 금지 — 사람 검토 후 실행.", "stories": ["REQ-014 CC-595"]}, {"slug": "08-withdrawals", "group": "회원 관리", "title": "탈퇴 처리", "reqs": ["REQ-018"], "desc": "회원 탈퇴를 처리하고 이력을 조회한다. 재가입 정책은 UNR-007(salt 해시 블랙리스트 후보).", "stories": ["REQ-018 CC-599"]}, {"slug": "09-ledger", "group": "보상·포인트", "title": "자산·원장 조회", "reqs": ["REQ-019"], "desc": "회원 자산(포인트·Energy)과 변동 원장을 조회한다. 모든 자산 변경은 원장 기록 필수.", "stories": ["REQ-019 CC-600"]}, {"slug": "10-manual-adjust", "group": "보상·포인트", "title": "포인트·Energy 수동 조정", "reqs": ["REQ-020", "REQ-021"], "desc": "포인트·Energy를 수동으로 지급·차감한다. 사유 필수, 원장·감사와 원자적 기록. Clawback 음수 잔액 예외는 UNR-012.", "stories": ["REQ-020 CC-601", "REQ-021 CC-602"]}, {"slug": "11-reward-channels", "group": "보상·포인트", "title": "채널별 보상·실패 재처리", "reqs": ["REQ-022", "REQ-023"], "desc": "보상 채널별 지급 현황을 조회하고, 실패한 보상을 검토 후 재처리한다.", "stories": ["REQ-022 CC-603", "REQ-023 CC-604"]}, {"slug": "12-ad-ssv", "group": "광고 운영", "title": "광고 시청·SSV 이력", "reqs": ["REQ-024", "REQ-025"], "desc": "AdMob SSV 검증 이력과 회원별 광고 시청·한도 현황을 조회한다.", "stories": ["REQ-024 CC-605", "REQ-025 CC-606"]}, {"slug": "13-offerwall", "group": "광고 운영", "title": "오퍼월 이력", "reqs": ["REQ-026"], "desc": "TNK 오퍼월 참여·보상 이력을 조회한다.", "stories": ["REQ-026 CC-607"]}, {"slug": "14-ad-policy", "group": "광고 운영", "title": "광고 정책·노출 관리", "reqs": ["REQ-027", "REQ-028"], "desc": "광고·오퍼월 운영 정책(한도·단가·쿨다운)과 광고 콘텐츠 노출을 관리한다. 동적 정책 저장소(UNR-002) 기반.", "stories": ["REQ-027 CC-608", "REQ-028 CC-609"]}, {"slug": "15-chat-history", "group": "채팅·AI", "title": "채팅 이력 조회", "reqs": ["REQ-029"], "desc": "회원별 채팅 세션·메시지 이력을 조회한다.", "stories": ["REQ-029 CC-610"]}, {"slug": "16-chat-analytics", "group": "채팅·AI", "title": "채팅 성공·실패 분석", "reqs": ["REQ-030"], "desc": "채팅 성공률·실패 사유·응답 시간을 분석한다.", "stories": ["REQ-030 CC-611"]}, {"slug": "17-ai-policy", "group": "채팅·AI", "title": "AI 라우팅·품질 풀 정책", "reqs": ["REQ-032", "REQ-033"], "desc": "AI 모델 라우팅 정책과 품질 풀을 운영한다. 동적 정책 저장소(UNR-002) 기반.", "stories": ["REQ-032 CC-613", "REQ-033 CC-614"]}, {"slug": "18-products", "group": "상점·주문", "title": "상품·재고 관리", "reqs": ["REQ-034", "REQ-035"], "desc": "상점 상품과 재고·판매 정책을 관리한다.", "stories": ["REQ-034 CC-615", "REQ-035 CC-616"]}, {"slug": "19-orders", "group": "상점·주문", "title": "주문 관리", "reqs": ["REQ-036", "REQ-037", "REQ-038"], "desc": "주문 조회, 취소·복구, 교환 상품 발송을 관리한다.", "stories": ["REQ-036 CC-617", "REQ-037 CC-618", "REQ-038 CC-619"]}, {"slug": "20-evolution", "group": "콘텐츠·리텐션", "title": "진화 정책·이력", "reqs": ["REQ-039", "REQ-040"], "desc": "캐릭터 진화 정책을 관리하고 진화 이력을 조회한다.", "stories": ["REQ-039 CC-620", "REQ-040 CC-621"]}, {"slug": "21-retention-policy", "group": "콘텐츠·리텐션", "title": "출석·초대·룰렛 정책", "reqs": ["REQ-041"], "desc": "출석·초대·룰렛 등 리텐션 이벤트 정책을 관리한다. 동적 정책 저장소(UNR-002) 기반.", "stories": ["REQ-041 CC-622"]}, {"slug": "22-notices-terms", "group": "고객지원·공지", "title": "공지·약관 관리", "reqs": ["REQ-042", "REQ-043"], "desc": "공지사항을 등록·노출 관리하고 약관 개정을 관리한다.", "stories": ["REQ-042 CC-623", "REQ-043 CC-624"]}, {"slug": "23-voc", "group": "고객지원·공지", "title": "문의·VoC 관리", "reqs": ["REQ-044", "REQ-045"], "desc": "고객 문의·VoC를 접수·배정하고 답변·처리 이력을 관리한다.", "stories": ["REQ-044 CC-625", "REQ-045 CC-626"]}, {"slug": "24-app-settings-push", "group": "고객지원·공지", "title": "앱 설정·푸시 발송", "reqs": ["REQ-046", "REQ-047"], "desc": "앱 버전·서비스 설정을 관리하고 푸시 알림을 발송한다.", "stories": ["REQ-046 CC-627", "REQ-047 CC-628"]}, {"slug": "25-system-status", "group": "시스템 운영", "title": "서비스 상태·성능", "reqs": ["REQ-048", "REQ-049"], "desc": "서비스 상태(health)·오류·응답시간을 조회한다.", "stories": ["REQ-048 CC-629", "REQ-049 CC-630"]}, {"slug": "26-deploy", "group": "시스템 운영", "title": "배포·재기동 요청", "reqs": ["REQ-050"], "desc": "등록된 파이프라인으로만 배포·재기동을 요청한다. 파이프라인 외 임의 운영 작업 금지.", "stories": ["REQ-050 CC-631"]}, {"slug": "27-marketing", "group": "마케팅·정산", "title": "마케팅 비용·유입 분석", "reqs": ["REQ-051", "REQ-052", "REQ-053"], "desc": "마케팅 채널 비용을 관리하고 유입·전환·유입 회원 수익을 분석한다. 외부 연동 방식은 UNR-005.", "stories": ["REQ-051 CC-632", "REQ-052 CC-633", "REQ-053 CC-634"]}, {"slug": "28-revenue-settlement", "group": "마케팅·정산", "title": "수익·정산", "reqs": ["REQ-054", "REQ-055"], "desc": "서비스 수익 현황과 파트너 정산 내역을 조회한다. 휴면 Ledger 회계는 UNR-004(OPEN).", "stories": ["REQ-054 CC-635", "REQ-055 CC-636"]}, {"slug": "29-abuse", "group": "어뷰징·위험", "title": "이상 적립·식별자 차단", "reqs": ["REQ-056", "REQ-057"], "desc": "이상 적립 후보를 조회하고 기기·앱 식별자를 차단한다. 자동 제재 금지 — 사람 검토 후 실행.", "stories": ["REQ-056 CC-637", "REQ-057 CC-638"]}, {"slug": "30-i18n", "group": "국제화", "title": "다국어·국가별 지표", "reqs": ["REQ-058", "REQ-059"], "desc": "다국어 콘텐츠를 관리하고 국가·통화별 지표를 조회한다. 번역 소유 구조는 UNR-001.", "stories": ["REQ-058 CC-639", "REQ-059 CC-640"]}, {"slug": "31-admin-accounts", "group": "관리자·보안", "title": "관리자 계정 관리", "reqs": ["REQ-002"], "desc": "관리자 계정을 생성·수정·비활성화한다.", "stories": ["REQ-002 CC-583"]}, {"slug": "32-roles", "group": "관리자·보안", "title": "역할·권한 설정", "reqs": ["REQ-003"], "desc": "역할별 권한(조회·변경·다운로드)을 관리한다. 권한은 서버 측 검증이 기준, 메뉴 노출은 파생.", "stories": ["REQ-003 CC-584"]}, {"slug": "33-audit-log", "group": "관리자·보안", "title": "감사 로그 조회", "reqs": ["REQ-005", "REQ-006"], "desc": "관리자 변경 감사와 민감정보 조회 감사를 검색·조회한다. 보존 기간·백업은 UNR-010.", "stories": ["REQ-005 CC-586", "REQ-006 CC-587"]}];
const list = document.getElementById('list');
let curGroup = null;
PAGES.forEach((p, i) => {
  if (p.group !== curGroup) { curGroup = p.group;
    const g = document.createElement('div'); g.className = 'grp'; g.textContent = p.group; list.appendChild(g); }
  const el = document.createElement('div'); el.className = 'pg'; el.id = 'pg' + i;
  el.innerHTML = '<span class="no">' + p.slug.slice(0,2) + '</span><span>' + p.title + '</span>';
  el.onclick = () => select(i); list.appendChild(el);
});
document.getElementById('cnt').textContent = '전체 ' + PAGES.length;
function select(i) {
  const p = PAGES[i];
  document.getElementById('fr').src = 'pages/' + p.slug + '/index.html';
  document.querySelectorAll('.pg').forEach(e => e.classList.remove('on'));
  document.getElementById('pg' + i).classList.add('on');
  document.getElementById('ititle').textContent = p.title;
  document.getElementById('idesc').textContent = p.desc;
  document.getElementById('itags').innerHTML = p.stories.map(s => '<span class="tag">' + s + '</span>').join('');
}
select(1);
</script></body></html>
