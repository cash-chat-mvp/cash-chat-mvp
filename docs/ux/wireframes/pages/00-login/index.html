<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>로그인 — 와이어프레임</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',sans-serif}
body{background:#fafafa;color:#333;font-size:13px}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
aside{width:190px;background:#fff;border-right:1px solid #e5e5e5;padding:14px 0;flex-shrink:0}
aside .logo{font-weight:700;font-size:15px;padding:4px 16px 14px;border-bottom:1px solid #eee;margin-bottom:10px}
aside .grp{font-size:10px;color:#999;padding:10px 16px 4px}
aside a{display:block;padding:5px 16px;color:#444;font-size:12.5px}
aside a:hover{background:#f4f4f4}
aside a.on{background:#f0f0f0;font-weight:700;border-right:2px solid #555}
main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #e5e5e5;padding:10px 22px}
.topbar .search{flex:0 0 260px;margin-left:auto;border:1px solid #ddd;border-radius:4px;padding:5px 10px;color:#aaa}
.topbar .mi{color:#666;font-size:12px}
.content{padding:20px 24px;max-width:1080px}
h1{font-size:17px;margin-bottom:4px}
.desc{color:#777;margin-bottom:16px;font-size:12.5px}
.reqs{margin-bottom:16px}.reqs span{display:inline-block;background:#eee;border-radius:3px;padding:2px 7px;margin-right:5px;font-size:11px;color:#555}
.cards{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{flex:1;min-width:130px;background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:12px 14px}
.card .lb{font-size:11px;color:#888;margin-bottom:6px}.card .val{font-size:19px;font-weight:700}.card .sub{font-size:10.5px;color:#aaa;margin-top:5px}
.filters{display:flex;gap:10px;align-items:flex-end;background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.flt{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#888}
.inp{display:inline-block;border:1px solid #ddd;border-radius:4px;padding:5px 10px;background:#fcfcfc;color:#aaa;min-width:120px}
.inp.wide{min-width:240px}
.btn{display:inline-block;border:1px solid #ccc;border-radius:4px;padding:5px 16px;background:#f5f5f5;color:#555;cursor:default}
.btn.dark{background:#444;color:#fff;border-color:#444}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e5e5;border-radius:6px;margin-bottom:16px}
th{background:#f7f7f7;font-size:11px;color:#777;text-align:left;padding:8px 10px;border-bottom:1px solid #e5e5e5}
td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#bbb}
.chart{height:220px;background:#f0f0f0;border:1px solid #e0e0e0;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#999;margin-bottom:16px;
 background-image:linear-gradient(to top right,transparent calc(50% - 1px),#ddd,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),#ddd,transparent calc(50% + 1px))}
.tabs{display:flex;gap:2px;border-bottom:1px solid #ddd;margin-bottom:16px}
.tab{padding:7px 16px;color:#888;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0}
.tab.on{background:#fff;border-color:#ddd;color:#222;font-weight:700}
.form{background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:16px;margin-bottom:16px}
.fsec{margin-bottom:14px}.fsec h3{font-size:13px;margin-bottom:8px}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:12px;color:#666}
.frow>span:first-child{flex:0 0 150px}
.fbtn{display:flex;gap:8px;margin-top:10px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:12px 16px;margin-bottom:16px}
.drow{display:flex;padding:6px 0;border-bottom:1px solid #f2f2f2;font-size:12px}
.dlb{flex:0 0 130px;color:#888}.dval{color:#bbb}
.modal{border:2px dashed #bbb;border-radius:8px;background:#fff;padding:16px;margin-bottom:16px;max-width:460px}
.modal .mtag{font-size:10px;color:#999;margin-bottom:8px}
.modal h3{font-size:13px;margin-bottom:8px}
.mline{font-size:12px;color:#888;padding:5px 0;border-bottom:1px solid #f2f2f2}
.note{background:#f7f7f2;border:1px solid #e8e8dd;border-radius:5px;padding:8px 12px;color:#888;font-size:11.5px;margin-bottom:16px}
.pgn{text-align:center;color:#999;margin-bottom:16px}
.loginwrap{min-height:100vh;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#fafafa}
.logincard{width:340px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:22px}
.logincard h2{font-size:16px;margin-bottom:14px}.logincard h3{font-size:13px;margin-bottom:10px}
.logincard .frow{flex-direction:column;align-items:stretch;gap:4px}.logincard .frow>span:first-child{flex:none}
</style></head><body><div class="loginwrap"><div class="logincard"><h2>Cash Chat Admin</h2><label class="frow"><span>아이디</span><span class="inp wide">&nbsp;</span></label><label class="frow"><span>비밀번호</span><span class="inp wide">&nbsp;</span></label><div class="fbtn"><span class="btn dark" style="width:100%;text-align:center">로그인</span></div><div class="note">실패 시 "아이디 또는 비밀번호가 올바르지 않습니다" 동일 응답 · 연속 실패 시 잠금</div></div><div class="logincard"><h3>추가 인증 (TOTP)</h3><label class="frow"><span>인증 코드 6자리</span><span class="inp wide">&nbsp;</span></label><div class="fbtn"><span class="btn dark" style="width:100%;text-align:center">확인</span></div><div class="note">세션 유휴 만료 시 재인증</div></div></div></body></html>
