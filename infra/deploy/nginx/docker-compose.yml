services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cash-chat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      # 온디바이스 Gemma 모델 정적 서빙 디렉터리 (gemma-4-E2B-it.litertlm 를 여기에 둔다)
      - ./models:/srv/models:ro
    command: >
      /bin/sh -c "while :; do
      sleep 21600 & wait $${!};
      nginx -s reload;
      done &
      nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: cash-chat-certbot
    restart: unless-stopped
    volumes:
      - ./certbot-www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 43200 & wait $${!};
      done"

# nginx 가 백엔드(cash-chat_default 네트워크의 cash-chat-backend)를 호스트명으로 프록시하려면
# 반드시 같은 네트워크에 있어야 한다. 이 설정이 없으면 `docker compose up -d`가 nginx 를
# 별도 nginx_default 네트워크에 띄워 "host not found in upstream cash-chat-backend"로 크래시한다.
networks:
  default:
    name: cash-chat_default
    external: true
